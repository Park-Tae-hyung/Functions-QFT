    else if (!A.isQ) hint = `지금은 진술문(설명하는 문장)이에요. QFT 규칙 4 — 「~일까?」, 「왜 ~일까?」처럼 질문으로 바꿔 볼까요?`;
    else if (A.fakeIf) hint = `「라면」이 붙어 있지만 무엇을 바꾸는지가 빠졌어요. 「만약 ${J(cond, '이', '가')} 달라진다면 ${J(term, '은', '는')} …」처럼 바꿀 조건을 분명히 써 볼까요?`;
    else if (A.lv === 'what') hint = A.trivial ? `뜻을 확인했다면, 「왜 ${J(term, '을', '를')} 그렇게 정했을까?」처럼 이유를 물어볼까요?` : `「왜」나 「어떻게」를 붙여 이유나 방법을 묻는 질문으로 바꿔 볼까요? (예: 왜 ${J(term, '은', '는')} … 일까?)`;
    else if (A.lv === 'howwhy') hint = `「만약 ${J(cond, '이', '가')} 바뀐다면 …」을 붙이면 If 질문이 돼요.`;
    else hint = `멋진 If 질문이에요! 친구가 직접 확인할 수 있게 바꾼 조건을 구체적인 예(숫자, 예: \\(f(x)=2x\\) 같은 특정 함수)로 정해 볼까요?`;
    const praise = !A.onTopic ? '생각을 질문으로 적어 본 것 자체가 좋은 출발이에요.' : PR[best];
    return { level:A.lv, open:A.open, scores:sc, praise, improve: sc[worst] >= 2 ? '거의 완벽해요! 친구 질문에 답글로 생각을 나눠 보세요.' : IM[worst],
      hint, next: A.lv === 'what' ? 'howwhy' : 'if', terms:A.terms.slice(0, 4), fakeIf:A.fakeIf };
  },
  creative(t){
    const A = ENGINE.analyze(t), K = kb(), term = A.terms[0] || (LESSON.concepts || ['함수'])[0];
    const conds = shuffle(K.conds.filter(c => !t.includes(c))), link = pick(shuffle(K.links), 1), c1 = conds[0] || K.conds[0];
    const num = pick(shuffle(K.nums), 0);
    const prop = /법칙|대칭|일대일|성립|같|다르/.test(term + t);
    const pool = [
      { method:'조건 바꾸기', why:'조건을 바꾸면 성질이 어디까지 유지되는지 알 수 있어요.', seed:`만약 ${J(c1, '이', '가')} 달라진다면 ${J(term, '은', '는')} …` },
      { method:'반대로 뒤집기', why:'반대 경우를 찾으면 개념의 경계가 보여요.', seed: prop ? `거꾸로, 이 성질이 깨지는 경우는 …` : `${J(term, '이', '가')} 되지 않는 경우(반례)는 …` },
      { method:'일반화하기', why:'한 예에서 찾은 규칙이 언제나 맞는지 확인하게 돼요.', seed:`모든 ${term}에 대해서도 항상 …` },
      { method:'생활과 연결하기', why:'생활 장면과 연결하면 친구들도 궁금해해요.', seed:`${link}에서 ${J(term, '은', '는')} …` },
      { method:'극단으로 보내기', why:'아주 크거나 0에 가까운 값을 넣으면 숨은 성질이 드러나요.', seed:`${J(num, '을', '를')} 아주 크게 하거나 0에 가깝게 하면 …` }];
    const ideas = shuffle(pool).slice(0, 3).map(i => ({ ...i, example:'' }));
    return { ideas, tip:'씨앗을 눌러 끝을 내 말로 채우면 나만의 질문이 돼요. 그대로 쓰지 말고 조금씩 바꿔 보세요!' };
  },
  coach(t){
    const A = ENGINE.analyze(t), K = kb(), term = A.terms[0] || (LESSON.concepts || ['함수'])[0];
    const confused = /모르|헷갈|이해가?\s*안|어려|이상|왜지|잘\s*안/.test(t);
    const link = pick(K.links, hashOf(t)), cond = pick(K.conds, hashOf(t) + 1);
    return {
      mirror: confused ? `「${t.slice(0, 36)}${t.length > 36 ? '…' : ''}」 — 어딘가 걸리는 부분이 있군요. 걸린다는 건 좋은 질문이 가까이 있다는 신호예요.`
                       : `「${t.slice(0, 36)}${t.length > 36 ? '…' : ''}」에 대해 생각하고 있군요.`,
      asks: [
        A.terms.length ? `「${term}」의 뜻을 내 말로 한 문장으로 말해 보면, 어느 부분에서 멈칫하나요?` : '그 생각에서 가장 이상하다고 느낀 낱말 하나를 고른다면 무엇인가요?',
        `그 생각이 언제나 맞을까요? ${J(cond, '을', '를')} 바꿔 보면 어떻게 될지 예를 하나 들어 볼까요?`,
        `${link}처럼 생활 속 장면으로 바꾸면 무엇이 같고 무엇이 다를까요?` ],
      starters: [ `왜 ${J(term, '은', '는')} …`, `만약 ${J(cond, '이', '가')} 바뀐다면 …` ],
      cheer: '질문을 완성하지 않아도 괜찮아요. 위 질문 중 하나에 답해 보면 나만의 질문이 저절로 나와요.' };
  },
  note(qtext, ex){
    const n = ex.note || {}, K = kb(), all = [n.cue, n.body, n.summary].join('\n'), flat = all.replace(/\s/g, '');
    const need = LESSON.concepts || [], have = need.filter(w => flat.includes(w.replace(/\s/g, ''))), miss = need.filter(w => !have.includes(w));
    const hasDef = /뜻|정의|이란|란\s|:/.test(n.body || ''), hasEx = /예\)|예시|예를|예:|예 :|보기/.test(all), hasWarn = /주의|조심|헷갈|아니|다르/.test(all);
    const sumN = (n.summary || '').split(/\n|(?<=[다요])\.\s*/).map(x => x.trim()).filter(x => x.length > 3).length;
    const qs = (qtext || '').split('\n').map(s => s.trim()).filter(Boolean);
    const check = K.miscon.filter(([re]) => re.test(all)).map(([, m]) => m);
    const good = [];
    if (have.length) good.push(`핵심 개념 ${have.slice(0, 4).join(', ')}${have.length > 4 ? ' …' : ''}을(를) 노트에 담았어요.`);
    if (hasDef && hasEx) good.push('정의와 예시를 함께 정리해서 이해가 단단해요.');
    if (!hasDef) check.push('필기 칸에 개념의 「정의」를 한 줄로 적어 보세요.');
    if (!hasEx) check.push('정의 아래에 예시를 하나 붙이면 기억이 오래가요.');
    if (!hasWarn && flat.length > 40) check.push('헷갈리기 쉬운 점(주의)을 한 줄 적어 두면 시험 전에 큰 도움이 돼요.');
    const qlv = qs.map(q => ENGINE.analyze(q).lv);
    const QT = { what:'사실 확인 질문이에요. 「왜」를 붙여 한 칸 올려 볼까요?', howwhy:'이유를 묻는 좋은 질문이에요. 조건을 바꾸면 If 질문이 돼요.', if:'조건을 바꾼 창의 질문이에요! 바꿀 값을 구체적으로 정해 보세요.' };
    const seeds = miss.slice(0, 2).map(w => ({ level:'what', starter:`${J(w, '은', '는')} …` }));
    if (!qlv.includes('howwhy')) seeds.push({ level:'howwhy', starter:`왜 ${J(have[0] || need[0] || '함수', '은', '는')} …` });
    if (!qlv.includes('if')) seeds.push({ level:'if', starter:`만약 ${J(pick(K.conds, flat.length), '이', '가')} 바뀐다면 …` });
    const score = Math.min(10, Math.round(have.length / Math.max(1, need.length) * 4) + (hasDef ? 1 : 0) + (hasEx ? 1 : 0) + (hasWarn ? 1 : 0)
      + Math.min(1, sumN / 3) + Math.min(2, new Set(qlv).size * 0.7) - Math.min(2, K.miscon.filter(([re]) => re.test(all)).length));
    return { good, missing:miss.slice(0, 4), check:check.slice(0, 4),
      questions: qs.map((q, i) => ({ q, level:qlv[i], tip:QT[qlv[i]] })), seeds:seeds.slice(0, 3),
      summary_tip: sumN < 3 ? '요약 칸을 「1. 정의 2. 성질 3. 생활 예」처럼 세 문장으로 채워 보세요.' : '요약에 「왜 그런지」를 한 문장 더 넣으면 완벽해요.',
      score: Math.max(0, Math.round(score)) };
  }
};

/* ---------- 묻기 → 엔진 분석, 그리고 선생님 화면용 기록 ---------- */
async function askAI(mode, text, extra){
  extra = extra || {};
  await new Promise(r => setTimeout(r, 350));            // 「생각하는 중」 표시가 보이도록 잠깐
  const res = { src:'engine', model:'engine-v1', r:ENGINE[mode](text, extra) };
  if (ME.no){
    rpc('qf_ai_save', { p_lesson:LESSON.code, p_no:ME.no, p_mode:mode,
      p_input: mode === 'note' ? JSON.stringify({ ...(extra.note || {}), questions:text }).slice(0, 4000) : text,
      p_output:res.r, p_model:res.model }).catch(() => {});
  }
  return res;
}

/* ---------- 질문 상자에 붙이기 ---------- */
function bindAIComposer(box, o){
  const ta = $('textarea', box), out = $('.aiout', box), st = $('.aist', box);
  const run = async (mode) => {
    if (needLogin()) return;
    const t = ta.value.trim();
    if (t.length < 4){ st.textContent = '질문을 먼저 4자 이상 적어 보세요.'; return; }
    st.textContent = mode === 'evaluate' ? '🧠 질문을 살펴보는 중…' : '🧠 아이디어를 찾는 중…';
    $$('.aib', box).forEach(b => b.disabled = true);
    const res = await askAI(mode, t, { ref:o.refLabel || '' });
    $$('.aib', box).forEach(b => b.disabled = false); st.textContent = '';
    out.innerHTML = mode === 'evaluate' ? renderEval(res) : renderCreative(res);
    out.classList.add('on'); tex(out); bindSeeds(out, ta);
    if (mode === 'evaluate' && window.SND) SND.hint();
  };
  $('.aib.ev', box).onclick = () => run('evaluate');
  $('.aib.cr', box).onclick = () => run('creative');
}
function bindSeeds(host, ta){
  $$('.seedbtn', host).forEach(b => b.onclick = () => {
    const s = b.dataset.seed.replace(/…$/, '').trim();
    if (typeof ta === 'function'){ ta(s); return; }
    ta.value = s + ' '; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); ta.dispatchEvent(new Event('input'));
    ta.scrollIntoView({ behavior:'smooth', block:'center' });
  });
}

/* ---------- 질문지 ---------- */
function drawNoteQs(){
  const host = $('#nQs'); if (!host) return;
  while (NOTE.questions.length < 3) NOTE.questions.push({ q:'', level:'', posted:false });
  host.innerHTML = NOTE.questions.map((x, i) => {
    const slot = QSLOT[i], lv = x.q ? detectLevel(x.q) : '';
    return `<div class="nq" data-i="${i}"><div class="nqh"><b>${slot ? slot[1] : `질문 ${i + 1}`}</b>
        <span class="lvtag ${lv}">${lv ? LVTXT[lv] : ''}</span>${x.posted ? '<span class="nposted">🗳️ 광장에 올림</span>' : ''}</div>
      <textarea maxlength="300" placeholder="${esc(slot ? slot[2] : '자유롭게 질문을 더 써 보세요')}">${esc(x.q)}</textarea>
      <div class="nqa"><button type="button" class="aib ev">🧠 평가</button><button type="button" class="aib cr">🚀 창의적으로</button>
        ${x.posted ? '' : '<button type="button" class="aib post">🗳️ 광장에 올리기</button>'}<span class="aist"></span></div><div class="aiout"></div></div>`;
  }).join('');
  $$('.nq', host).forEach(el => {
    const i = +el.dataset.i, ta = $('textarea', el), tag = $('.lvtag', el);
    ta.oninput = () => { NOTE.questions[i].q = ta.value; const lv = ta.value.trim() ? detectLevel(ta.value) : '';
      NOTE.questions[i].level = lv; tag.className = 'lvtag ' + lv; tag.textContent = lv ? LVTXT[lv] : ''; noteDirty(); };
    bindAIComposer(el, { refLabel:'개념 노트 질문지' });
    const pb = $('.aib.post', el);
    if (pb) pb.onclick = async () => {
      if (needLogin()) return;
      const q = ta.value.trim(); if (q.length < 4){ snack('질문을 4자 이상 써 주세요'); return; }
      try{
        const lv = detectLevel(q);
        const row = await rpc('qf_post', { p_lesson:LESSON.code, p_kind:'concept', p_ref:'note', p_parent:null, p_body:q,
          p_level:lv, p_qtype: lv === 'what' ? 'closed' : 'open', p_no:ME.no, p_name:ME.name });
        BOARD.unshift(row); NOTE.questions[i].posted = true; refreshLists(); drawNoteQs(); noteSave(true);
        celebrate(0, 1, '🗳️ 질문 광장에 올렸어요!');
      }catch(e){ snack(e.message); }
    };
  });
}
function putSeedNote(s){
  let i = NOTE.questions.findIndex(x => !x.q.trim());
  if (i < 0){ NOTE.questions.push({ q:'', level:'', posted:false }); i = NOTE.questions.length - 1; }
  NOTE.questions[i].q = s + ' '; drawNoteQs();
  const ta = $(`#nQs .nq[data-i="${i}"] textarea`); if (ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); ta.scrollIntoView({ behavior:'smooth', block:'center' }); }
  noteDirty();
}

/* ---------- 저장 ---------- */
let _nT = null, _nBusy = false, _nAgain = false;
function noteDirty(){
  const s = $('#nSave'); if (s) s.textContent = '✏️ 쓰는 중…';
  try{ localStorage.setItem('qf_note_' + LESSON.code + '_' + ME.no, JSON.stringify({ cue:$('#nCue').value, body:$('#nBody').value, summary:$('#nSum').value, questions:NOTE.questions })); }catch(e){}
  clearTimeout(_nT); _nT = setTimeout(() => noteSave(false), 1500);
}
async function noteSave(submit, ai){
  if (!ME.no) return;
  if (_nBusy){ _nAgain = true; return; }
  _nBusy = true;
  const s = $('#nSave');
  let sketch = 'keep';
  if (NOTE.sketchDirty){ sketch = PAD.empty() ? '' : PAD.export(); NOTE.sketchDirty = false; }
  try{
    const r = await rpc('qf_note_save', { p_lesson:LESSON.code, p_no:ME.no, p_name:ME.name,
      p_cue:$('#nCue').value, p_body:$('#nBody').value, p_summary:$('#nSum').value, p_sketch:sketch,
      p_questions:NOTE.questions.filter(x => x.q.trim()).map(x => ({ q:x.q.trim(), level:detectLevel(x.q), posted:!!x.posted })),
      p_ai: ai || null, p_submit: !!submit });
    NOTE.submitted = r.submitted;
    const t = new Date(r.updated_at);
    if (s) s.textContent = `✅ 자동 저장됨 ${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}`;
    paintSub(); netState(true);
  }catch(e){
    if (sketch !== 'keep') NOTE.sketchDirty = true;
    if (s) s.textContent = '⚠️ 저장 실패 — ' + e.message + ' (이 기기에는 임시 보관 중)';
    netState(false);
  }
  _nBusy = false;
  if (_nAgain){ _nAgain = false; noteSave(false); }
}
function paintSub(){ const b = $('#nSub'); if (b){ b.textContent = NOTE.submitted ? '📤 제출 완료' : '작성 중'; b.classList.toggle('on', NOTE.submitted); } }

async function loadNote(){
  if (!ME.no || !$('#nCue')) return;
  if (NOTE.loadedFor === ME.no) return;
  NOTE.loadedFor = ME.no;
  let d = null;
  try{ d = await rpc('qf_note_get', { p_lesson:LESSON.code, p_no:ME.no }); }catch(e){}
  let local = null;
  try{ local = JSON.parse(localStorage.getItem('qf_note_' + LESSON.code + '_' + ME.no) || 'null'); }catch(e){}
  const src = d || local || {};
  $('#nCue').value = src.cue || ''; $('#nBody').value = src.body || ''; $('#nSum').value = src.summary || '';
  NOTE.questions = (src.questions || []).map(x => ({ q:x.q || '', level:x.level || '', posted:!!x.posted }));
  NOTE.submitted = !!(d && d.submitted); NOTE.ai = d && d.ai;
  PAD.reset(d && d.sketch);
  drawNoteQs(); paintSub();
  if (d && d.updated_at){ const t = new Date(d.updated_at); $('#nSave').textContent = `✅ 저장됨 ${t.getMonth() + 1}/${t.getDate()} ${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}`; }
  if (NOTE.ai && NOTE.ai.r){ const o = $('#nAiOut'); o.innerHTML = renderNoteAI(NOTE.ai); o.classList.add('on'); tex(o); bindSeeds(o, putSeedNote); }
  // 서버보다 이 기기의 임시본이 더 길면 (오프라인으로 쓴 경우) 다시 저장
  if (local && (!d || (local.body || '').length > (d.body || '').length)){
    $('#nCue').value = local.cue || ''; $('#nBody').value = local.body || ''; $('#nSum').value = local.summary || '';
    if (local.questions) NOTE.questions = local.questions; drawNoteQs(); noteSave(false);
  }
}

/* ---------- 손글씨 판 ---------- */
const PAD = (() => {
  let cv, ctx, base = null, strokes = [], cur = null, color = '#22223b', width = 4, eraser = false, sawPen = false, axis = false;
  function size(){ return { w:cv.width, h:cv.height }; }
  function redraw(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (base) ctx.drawImage(base, 0, 0, cv.width, cv.height);
    strokes.forEach(drawStroke);
  }
  function drawStroke(s){
    ctx.save();
    ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.c; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const p = s.p;
    if (p.length === 1){ ctx.beginPath(); ctx.arc(p[0][0], p[0][1], s.w * (s.erase ? 4 : 1) * (0.5 + p[0][2]) / 2, 0, 7); ctx.fillStyle = s.c; ctx.fill(); }
    for (let i = 1; i < p.length; i++){
      ctx.beginPath(); ctx.lineWidth = s.w * (s.erase ? 4 : 1) * (0.5 + (p[i][2] || .5));
      ctx.moveTo(p[i - 1][0], p[i - 1][1]); ctx.lineTo(p[i][0], p[i][1]); ctx.stroke();
    }
    ctx.restore();
  }
  function pos(e){ const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height, e.pressure && e.pointerType === 'pen' ? e.pressure : .5]; }
  function init(){
    cv = $('#pCv'); if (!cv) return; ctx = cv.getContext('2d');
    cv.addEventListener('pointerdown', e => {
      if (e.pointerType === 'pen') sawPen = true;
      if (sawPen && e.pointerType === 'touch') return;          // 손바닥 무시
      if (needLogin()) return;
      cv.setPointerCapture(e.pointerId);
      cur = { c:color, w:width, erase:eraser, p:[pos(e)] }; strokes.push(cur); drawStroke(cur); e.preventDefault();
    });
    cv.addEventListener('pointermove', e => {
      if (!cur) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      evs.forEach(ev => cur.p.push(pos(ev)));
      const p = cur.p, n = p.length;
      ctx.save(); ctx.globalCompositeOperation = cur.erase ? 'destination-out' : 'source-over';
      ctx.strokeStyle = cur.c; ctx.lineCap = 'round';
      for (let i = Math.max(1, n - evs.length); i < n; i++){ ctx.beginPath(); ctx.lineWidth = cur.w * (cur.erase ? 4 : 1) * (0.5 + p[i][2]); ctx.moveTo(p[i - 1][0], p[i - 1][1]); ctx.lineTo(p[i][0], p[i][1]); ctx.stroke(); }
      ctx.restore(); e.preventDefault();
    });
    const end = () => { if (!cur) return; cur = null; if (strokes.length > 60){ flatten(); } NOTE.sketchDirty = true; noteDirty(); };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
    $$('.pcol').forEach(b => b.onclick = () => { $$('.pcol').forEach(x => x.classList.toggle('on', x === b)); color = b.dataset.c; eraser = false; $('#pEraser').classList.remove('on'); });
    $$('.pw').forEach(b => b.onclick = () => { $$('.pw').forEach(x => x.classList.toggle('on', x === b)); width = +b.dataset.w; });
    $('#pEraser').onclick = () => { eraser = !eraser; $('#pEraser').classList.toggle('on', eraser); };
    $('#pUndo').onclick = () => { if (strokes.length){ strokes.pop(); redraw(); NOTE.sketchDirty = true; noteDirty(); } else snack('더 되돌릴 수 없어요'); };
    $('#pClear').onclick = () => { if (!confirmClear()) return; base = null; strokes = []; redraw(); NOTE.sketchDirty = true; noteDirty(); };
    $('#pGrid').onclick = () => { $('#pPad').classList.toggle('grid'); $('#pGrid').classList.toggle('on', $('#pPad').classList.contains('grid')); };
    $('#pAxis').onclick = () => { axis = !axis; $('#pPad').classList.toggle('axis', axis); $('#pAxis').classList.toggle('on', axis); };
    $('#pGrid').classList.add('on');
  }
  let _clr = 0;
  function confirmClear(){ const now = Date.now(); if (now - _clr < 2500) return true; _clr = now; snack('한 번 더 누르면 모두 지워져요'); return false; }
  function flatten(){ const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; c2.getContext('2d').drawImage(cv, 0, 0); base = c2; strokes = []; }
  return {
    init,
    reset(src){ if (!cv) return; strokes = []; base = null; redraw();
      if (src){ const img = new Image(); img.onload = () => { const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; const g = c2.getContext('2d'); g.drawImage(img, 0, 0, cv.width, cv.height);
        // 저장본의 흰 배경을 투명으로
        const d = g.getImageData(0, 0, c2.width, c2.height), a = d.data; for (let i = 0; i < a.length; i += 4) if (a[i] > 245 && a[i + 1] > 245 && a[i + 2] > 245) a[i + 3] = 0; g.putImageData(d, 0, 0);
        base = c2; redraw(); }; img.src = src; } },
    empty(){ return !base && !strokes.length; },
    export(){
      const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
      const g = out.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height); g.drawImage(cv, 0, 0);
      let url = out.toDataURL('image/webp', .72);
      if (!url.startsWith('data:image/webp')) url = out.toDataURL('image/jpeg', .8);
      if (url.length > 850000){ const s = document.createElement('canvas'); s.width = 800; s.height = 533; s.getContext('2d').drawImage(out, 0, 0, 800, 533); url = s.toDataURL('image/jpeg', .7); }
      return url;
    }
  };
})();

function bootNote(){
  if (!$('#nCue')) return;
  $$('#nCue, #nBody, #nSum').forEach(t => t.addEventListener('input', noteDirty));
  let lastTa = $('#nBody');
  $$('#nCue, #nBody, #nSum').forEach(t => t.addEventListener('focus', () => lastTa = t));
  $$('.nins').forEach(b => b.onclick = () => {
    const ta = lastTa, w = b.dataset.w, p = ta.selectionStart ?? ta.value.length;
    ta.value = ta.value.slice(0, p) + w + ta.value.slice(ta.selectionEnd ?? p); ta.focus();
    ta.setSelectionRange(p + w.length, p + w.length); noteDirty();
  });
  PAD.init();
  drawNoteQs();
  $('#nAddQ').onclick = () => { if (NOTE.questions.length >= 12){ snack('질문은 12개까지 쓸 수 있어요'); return; } NOTE.questions.push({ q:'', level:'', posted:false }); drawNoteQs(); };
  $('#nAi').onclick = async () => {
    if (needLogin()) return;
    const note = { cue:$('#nCue').value, body:$('#nBody').value, summary:$('#nSum').value };
    if ((note.body + note.cue + note.summary).trim().length < 10){ $('#nAiSt').textContent = '노트를 조금 더 쓴 다음 점검받아요.'; return; }
    $('#nAiSt').textContent = '🧠 노트를 읽는 중…'; $('#nAi').disabled = true;
    const qs = NOTE.questions.map(x => x.q.trim()).filter(Boolean).join('\n');
    const res = await askAI('note', qs, { note });
    $('#nAi').disabled = false; $('#nAiSt').textContent = '';
    const o = $('#nAiOut'); o.innerHTML = renderNoteAI(res); o.classList.add('on'); tex(o); bindSeeds(o, putSeedNote);
    NOTE.ai = { src:res.src, reason:res.reason || '', model:res.model || '', r:res.r, at:new Date().toISOString() };
    noteSave(false, NOTE.ai);
  };
  $('#nSubmit').onclick = async () => {
    if (needLogin()) return;
    if (($('#nBody').value + $('#nCue').value).trim().length < 10 && PAD.empty()){ snack('노트를 조금 더 쓴 다음 제출해요 🙂'); return; }
    clearTimeout(_nT); await noteSave(true);
    if (NOTE.submitted) celebrate(0, 1, '📤 노트 제출 완료!');
  };
  bindCoach('noteCoach', putSeedNote);
  window.addEventListener('beforeunload', () => { if (_nT){ clearTimeout(_nT); noteSave(false); } });
}

/* ===================================================================
   ✍️ 학생 풀이 기록 (work)
   · 개념마다 : 코넬 노트 + 그래프·식·그림 노트(+ 그래프 도구)
   · 문제마다 : 풀이 노트(손글씨) + 그래프 도구 + 고른 답
   · 쓰는 즉시 자동 저장(qf_work) → 선생님 화면 「🖥️ 학생 풀이 화면」에 모임
   · 손글씨는 그림 파일이 아니라 「선의 좌표」로 저장해서 가볍고, 선생님 화면에서 또렷하게 다시 그려짐
   =================================================================== */
const WK = { data:{}, dirty:new Set(), timer:null, busy:false, again:false, loadedFor:null, pads:{}, gts:{} };
const WK_GRAPH_RE = /그래프|점근선|평행이동|대칭이동|좌표평면|개형|직선 \\\(y=x\\\)/;
const wkRec = k => WK.data[k] || (WK.data[k] = {});
const wkLS = k => 'qf_wk_' + LESSON.code + '_' + ME.no + '_' + k;
const wkCanDraw = () => !!ME.no || (typeof TM !== 'undefined' && TM.on);     // 선생님은 시범용으로 쓸 수 있고 저장되지 않음
const pad2 = n => String(n).padStart(2, '0');

function wkStat(key, txt){ $$(`.wkst[data-st="${key}"]`).forEach(e => e.textContent = txt); }
function wkTouch(key){
  if (!ME.no) return;
  const r = wkRec(key); r._t = Date.now();
  WK.dirty.add(key); wkStat(key, '✏️ 쓰는 중…'); wkBadges(key);
  try { localStorage.setItem(wkLS(key), JSON.stringify(r)); } catch (e) {}
  clearTimeout(WK.timer); WK.timer = setTimeout(wkFlush, 1500);
}
function wkClean(r){
  const o = { _t:r._t || Date.now() };
  if (r.note && ((r.note.cue || '') + (r.note.body || '') + (r.note.sum || '')).trim()) o.note = r.note;
  if (r.ink && r.ink.s && r.ink.s.length) o.ink = r.ink;
  if (r.graph && (r.graph.f || []).some(x => (x || '').trim())) o.graph = { f:r.graph.f, win:r.graph.win };
  if (r.ans) o.ans = r.ans;
  return o;
}
async function wkFlush(){
  if (WK.busy){ WK.again = true; return; }
  WK.busy = true;
  const keys = [...WK.dirty]; WK.dirty.clear();
  for (const k of keys){
    if (!ME.no) break;
    try {
      await rpc('qf_work_save', { p_lesson:LESSON.code, p_no:ME.no, p_name:ME.name, p_key:k, p_data:wkClean(wkRec(k)) });
      try { localStorage.removeItem(wkLS(k)); } catch (e) {}
      const t = new Date(); wkStat(k, `✅ 자동 저장됨 ${t.getHours()}:${pad2(t.getMinutes())}`); netState(true);
    } catch (e) { WK.dirty.add(k); wkStat(k, '⚠️ 저장 실패 — ' + e.message + ' (이 기기에 임시 보관 중)'); netState(false); }
  }
  WK.busy = false;
  if (WK.again){ WK.again = false; wkFlush(); }
  else if (WK.dirty.size){ clearTimeout(WK.timer); WK.timer = setTimeout(wkFlush, 9000); }
}
async function wkLoad(force){

function wkBind(root){

  if (!_wkIO && 'IntersectionObserver' in window) _wkIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ mount(e.target); _wkIO.unobserve(e.target); } }), { rootMargin:'300px' });

    d.addEventListener('toggle', () => { if (d.open) mount(d); });

  $$('.cnote', root).forEach(n => { if (n._wk) return; n._wk = 1; const key = n.dataset.key; let lastTa = $('textarea[data-f="body"]', n);

async function gpPost(kind, parent, body, data, done){
  if (needLogin()) return;

    try{ GP.board = await rpc('qf_group_board', { p_lesson:LESSON.code, p_no:ME.no }); gpPaintBoard(); }catch(e){}

            <div class="tact"><button data-gfb="${r.id}">💬 피드백</button><button class="del" data-gdel="${r.id}">🗑</button></div></div>`; }).join('') || '<i>없음</i>'}</details></div>`; }).join('')}</div>`).join('')}`;

/* ---------- 📋 개인별 기록 ---------- */
const LNAME = { f1:'함수의 뜻과 그래프', f2:'합성함수', f3:'역함수', r1:'유리함수', r2:'유리함수의 그래프', r3:'무리함수' };
const LVW = { what:1, howwhy:2, if:3 };
function stRecord(P, s){
  const no = s.student_no, mine = a => a.filter(x => x.student_no === no);
  const posts = mine(P.posts), g = mine(P.gposts), resp = mine(P.responses);
  const R = it => resp.filter(r => r.item === it || (it instanceof RegExp && it.test(r.item)));
  return {
    no, name:s.name,
    qs:posts.filter(p => !['reply','free'].includes(p.kind)),          // 자유 질문방(익명)은 세특 근거에서 뺀다
    replies:posts.filter(p => p.kind === 'reply'),
    gq:g.filter(x => x.kind === 'q'), gr:g.filter(x => x.kind === 'r'), gchat:g.filter(x => x.kind === 'chat'), gres:g.filter(x => x.kind === 'result'),
    grp:(P.groups || []).find(x => x.student_no === no),
    port:R('portfolio'), debate:R('debate'), after:R('debate_after'), talk:R(/^talk\d$/), reflect:R('reflect'),
    notes:mine(P.notes || []), evals:mine(P.evals || []), solved:(P.solved || []).find(x => x.student_no === no),
    saved:(P.seteuk || []).find(x => x.student_no === no),
    work:(P.work || []).filter(x => x.student_no === no)
  };
}
/* 낱말 고르기 : 텍스트 마이닝 엔진으로 수학 핵심어만 (수식·기호는 빼고 한글 개념어만) */
const PERSONW = new Set(['오일러','디리클레','앨리스','갈릴레이','제논','아킬레스','거북이','카이사르','보일','거울','기계','입력','출력']);
const GENERIC = new Set(['함수','그래프','관계','식','값','조건','범위','변화','규칙','입력','출력','순서','차이','거리','시간','이상','이하','정의','계산','공식','위치','방향','이동','성질']);
function stTopics(texts, n){
  const f = {};
  texts.forEach(t => tokenize(t, true).filter(w => /^[가-힣]{2,}$/.test(w) && !PERSONW.has(w)).forEach(w => { f[w] = (f[w] || 0) + (GENERIC.has(w) ? 1 : 3); }));
  const top = Object.entries(f).sort((a, b) => b[1] - a[1]).slice(0, (n || 2) + 2).map(x => x[0]).filter(w => !GENERIC.has(w)).slice(0, n || 2);
  return top.filter(w => !GENERIC.has(w));                // 「함수」「순서」처럼 흔한 말만 있으면 주제로 쓰지 않음
}
const jong = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c < 11172 && c % 28 !== 0; };
const JO = (w, a, b) => w + (jong(w) ? a : b);                    // 와/과, 을/를, 은/는, 으로/로
const andJoin = ws => ws.length === 2 ? JO(ws[0], '과', '와') + ' ' + ws[1] : ws[0] || '';
const stPick = (arr, seed) => arr[Math.abs(seed) % arr.length];
const hashNo = s => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7);
const neisBytes = s => new TextEncoder().encode(String(s || '')).length;

function stDraft(r, salt){
  const h = hashNo(r.no) + (salt || 0) * 7919;
  const lv = k => r.qs.filter(q => q.level === k).length;
  const S = [];
  // ① 대표 문장 — 기록에서 가장 두드러진 특성
  const role = (r.port.map(p => p.body.role).filter(Boolean).pop() || '').replace(/\s*\(.*\)/, '');
  const chatWhy = r.gchat.filter(m => /왜냐하면|이유|근거|때문|반례|동의|생각이 달/.test(m.body)).length;
  const trait = lv('if') >= 2 || (lv('if') >= 1 && lv('if') >= lv('what')) ? 'if'
    : lv('howwhy') >= 2 ? 'why' : r.gres.length ? 'collab' : chatWhy >= 2 || r.talk.length >= 2 ? 'talk' : 'steady';
  const LEAD = {
    if:['주어진 조건을 바꾸어 보며 개념이 성립하는 범위를 스스로 따져 보는 탐구 태도가 일관되게 나타남.',
        '‘만약 조건이 달라진다면’이라는 물음으로 개념의 경계를 넓혀 가는 사고가 두드러짐.',
        '익숙한 결론에 머물지 않고 조건을 비틀어 새로운 상황을 상상해 보는 질문을 즐겨 만듦.'],
    why:['공식을 그대로 받아들이기보다 성립하는 이유를 끝까지 묻고 근거를 찾아 설명하려는 태도가 분명함.',
         '배운 내용마다 그 까닭을 되물으며 개념 사이의 연결을 스스로 확인하는 학습 습관이 자리 잡음.',
         '정의에서 출발해 결론이 나오는 과정을 따져 묻는 질문으로 개념을 깊이 있게 이해함.'],
    collab:['모둠에서 나온 질문을 함께 해결하고 그 과정을 정리해 학급과 나누는 일에 앞장서며 협력적 탐구를 이끎.',
            '모둠원의 생각을 모아 해결 과정을 글로 정리하고 공유하는 데 꾸준히 기여함.'],
    talk:['친구의 의견에 근거를 들어 동의하거나 다른 관점을 제시하며 토의를 깊게 만드는 데 기여함.',
          '토의 장면에서 자신의 생각을 근거와 함께 밝히고 다른 의견을 경청하며 생각을 다듬어 감.'],
    steady:['수업의 각 단계에서 스스로 질문을 만들고 확인 문제를 꾸준히 해결하며 함수 단원의 개념을 차근차근 쌓아 감.',
            '개념을 익힌 뒤 예제와 문제로 확인하고 궁금한 점을 질문으로 남기는 학습 흐름을 성실하게 이어 감.',
            '새로 배운 개념을 자신의 말로 다시 정리하고 궁금한 점을 질문으로 표현하며 이해를 넓혀 감.']
  };
  S.push({ k:'lead', t:stPick(LEAD[trait], h) });
  // ② 질문 활동 — 가장 수준 높은 질문 하나
  const best = r.qs.slice().sort((a, b) => ((b.picked ? 6 : 0) + (LVW[b.level] || 1) * 2 + Math.min(b.votes || 0, 5) * 0.6 + Math.min(String(b.body).length / 60, 1))
                                        - ((a.picked ? 6 : 0) + (LVW[a.level] || 1) * 2 + Math.min(a.votes || 0, 5) * 0.6 + Math.min(String(a.body).length / 60, 1)))[0];
  if (best){
    const tp = stTopics([best.body], 2), lesson = LNAME[best.lesson] || '함수';
    const kind = { if:'조건을 바꾸어 결과를 예측하는 질문', howwhy:'성립하는 이유를 묻는 질문', what:'개념의 뜻을 정확히 확인하는 질문' }[best.level] || '질문';
    const about = tp.length ? `${andJoin(tp)}${tp.length === 2 ? '의 관계' : ''}에 대해 ` : '';
    let tail = best.picked ? '학급 공동 탐구 질문으로 채택되어 친구들과 함께 답을 찾아가는 계기를 만듦'
      : (best.votes || 0) >= 3 ? '많은 친구의 공감을 얻어 함께 탐구할 질문으로 이어짐'
      : lv('what') && lv('if') ? '사실을 확인하는 질문에서 출발해 조건을 바꾸는 질문까지 스스로 수준을 높여 감'
      : lv('howwhy') && lv('what') ? '뜻을 확인하는 질문을 이유를 묻는 질문으로 발전시키며 생각을 깊게 함'
      : '질문 사다리를 따라 자신의 질문을 다듬어 감';
    S.push({ k:'q', t:`‘${lesson}’ 수업에서 ${about}${kind}을 만들고, ${tail}.` });
  }
  // ③ 소그룹 — 역할 · 해결 아이디어 · 해결 결과
  if (r.gq.length || r.gr.length || r.gres.length || role){
    const res = r.gres[r.gres.length - 1], how = res ? stTopics([res.data && res.data.how || res.body, res.data && res.data.ans || ''], 2) : [];
    let t = `소그룹 활동에서 ${role ? JO(role, '을', '를') + ' 맡아 ' : ''}`;
    const parts = [];
    if (r.gq.length) parts.push('모둠에 탐구할 질문을 제기하고');
    if (r.gr.length) parts.push(r.gr.length >= 3 ? '모둠원의 질문마다 해결의 실마리가 되는 아이디어를 제시하였으며' : '모둠원의 질문에 해결 아이디어를 보태었으며');
    if (res) parts.push(`${how.length ? JO(andJoin(how), '을', '를') + ' 근거로 ' : ''}질문을 해결한 과정과 결론을 정리하여 학급 전체에 공유함`);
    else parts.push(stPick(['모둠이 함께 답을 찾아가는 과정에 참여함', '모둠원과 해결 방법을 나누며 답을 찾아가는 과정에 힘을 보탬', '모둠의 해결 과정에 참여해 생각을 주고받음'], h >> 5));
    S.push({ k:'grp', t:t + parts.join(' ') + '.' });
  }
  // ③-2 학생이 보낸 「나의 활동 기록」 : 의미 있었던 질문과 해결 방법
  const pb = r.port.map(p => p.body).filter(b => b.best).pop();
  if (pb){ const t = stTopics([pb.best], 2), o = stTopics([pb.opinion || ''], 1);
    S.push({ k:'port', t:`활동을 돌아보며 가장 의미 있었던 질문으로 ${t.length ? andJoin(t) + '에 관한 물음' : '스스로 만든 물음'}을 꼽고 해결한 방법을 자신의 말로 정리했으며${o.length ? `, 토의에서는 ${JO(o[0], '을', '를')} 중심으로 의견을 밝힘` : ', 토의에서 낸 의견과 맡은 역할을 스스로 점검함'}.` }); }
  // ④ 토의·토론
  const db = r.debate[r.debate.length - 1], af = r.after[r.after.length - 1];
  if (db && db.body && (db.body.reason || db.body.stance)){
    const st = { pro:'찬성', con:'반대', mid:'신중한' }[db.body.stance] || '자신의';
    const why = stTopics([db.body.reason || '', db.body.rebut || ''], 2);
    const changed = af && af.body && af.body.stance && af.body.stance !== db.body.stance;
    S.push({ k:'deb', t:`${stPick(['책 속 토론에서', '고전 속 장면을 다룬 토론에서', '수학사 속 논쟁을 다룬 토론에서'], h >> 4)} ${st} 입장을 세워 ${why.length ? JO(andJoin(why), '을', '를') + ' 근거로 ' : '근거를 들어 '}주장을 펼쳤고, ${changed ? stPick(['토론 뒤 상대의 논거를 받아들여 자신의 생각을 새롭게 정리함', '토론을 거치며 입장을 다시 검토하고 달라진 생각의 근거를 스스로 밝힘', '상대 논거의 설득력을 인정하고 자신의 판단을 수정한 이유를 정리함'], h >> 2)
      : db.body.rebut ? stPick(['예상되는 반론에 대한 재반론까지 준비하며 논리를 다듬음', '상대가 내세울 반론을 미리 짐작해 답변을 마련하며 주장을 단단하게 함', '반대 의견을 먼저 검토하고 이에 답하는 논리를 세워 토론에 참여함'], h >> 2)
      : stPick(['상대 의견의 타당성을 따져 보며 자신의 논리를 보완함', '친구의 근거를 경청하고 자신의 주장과 비교하며 생각을 정교하게 함', '다른 입장의 근거를 검토하며 자신의 주장이 성립하는 조건을 되짚음'], h >> 2)}.` });
  } else if (chatWhy >= 2 || r.talk.length){
    const tp = stTopics(r.gchat.map(m => m.body).concat(r.talk.map(t => t.body.a || '')), 2);
    S.push({ k:'deb', t:`토의 과정에서 ${tp.length ? andJoin(tp) + '에 관한 ' : ''}자신의 생각을 이유와 함께 밝히고, 친구의 의견에 동의하거나 다른 관점을 덧붙이며 결론을 함께 이끌어 냄.` });
  }
  // ⑤ 학습 관리 (짧게)
  const wn = (r.work || []).filter(x => x.n).length, wi = (r.work || []).filter(x => x.i || x.g).length;

    X.forEach((x,i) => { const [cx,cy] = pX(i); s += `<g data-x="${x}" style="cursor:pointer"><circle cx="${cx}" cy="${cy}" r="15" fill="${pick === x ? '#ff7ba9' : '#fff'}" stroke="#ff7ba9" stroke-width="2"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-weight="900" fill="${pick === x ? '#fff' : '#4a3f5c'}">${x}</text></g>`; });
    Y.forEach((y,i) => { const [cx,cy] = pY(i); s += `<g data-y="${y}" style="cursor:pointer"><circle cx="${cx}" cy="${cy}" r="15" fill="#fff" stroke="#6fc3ff" stroke-width="2"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-weight="900" font-style="italic">${y}</text></g>`; });
    svg.innerHTML = s;
    $$('[data-x]', svg).forEach(g => g.onclick = () => { pick = g.dataset.x; SND.tap(); draw(); });
    $$('[data-y]', svg).forEach(g => g.onclick = () => {
      if (!pick){ snack('먼저 X의 원소를 눌러 주세요'); return; }
      const k = pairs.findIndex(p => p[0] === pick && p[1] === g.dataset.y);
      if (k >= 0) pairs.splice(k, 1); else pairs.push([pick, g.dataset.y]);
      pick = null; SND.tap(); draw();
    });
    // 판정
    const cnt = X.map(x => pairs.filter(p => p[0] === x).length);
    const isF = cnt.every(c => c === 1);
    const imgs = [...new Set(pairs.map(p => p[1]))];
    const one = isF && imgs.length === X.length;
    const onto = isF && imgs.length === Y.length;
    const cst = isF && imgs.length === 1;
    const J = (ok, t) => `<span class="${ok ? 'y' : 'n'}">${ok ? '✔' : '✘'} ${t}</span>`;
    $('.judge', host).innerHTML = J(isF,'함수') + J(one,'일대일함수') + J(one && onto,'일대일대응') + J(cst,'상수함수');
    let why = '';
    if (!isF){
      const zero = X.filter((x,i) => cnt[i] === 0), many = X.filter((x,i) => cnt[i] > 1);
      why = (zero.length ? `X의 원소 <b>${zero.join(', ')}</b>에 대응하는 것이 없어요. ` : '') +
            (many.length ? `X의 원소 <b>${many.join(', ')}</b>가 두 개 이상에 대응해요. ` : '') + '→ 함수가 아니에요.';
    } else {
      why = `정의역 <b>{1, 2, 3, 4}</b>, 공역 <b>{a, b, c, d}</b>, 치역 <b>{${imgs.sort().join(', ')}}</b>`;
      if (!one) why += ' · 서로 다른 원소가 같은 원소에 대응 → 일대일함수가 아니에요.';
    }
    $('.out', host).innerHTML = why + `<br><span style="color:var(--ink2);font-size:.84rem">🤔 만약 Y의 원소가 3개뿐이라면 일대일대응을 만들 수 있을까? 만약 X의 원소가 더 많다면?</span>`;
  }
  $$('[data-a]', host).forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'clear') pairs = [];
    if (a === 'const'){ const y = Y[Math.floor(Math.random()*4)]; pairs = X.map(x => [x, y]); }
    if (a === 'rand') pairs = X.map(x => [x, Y[Math.floor(Math.random()*4)]]);
    pick = null; draw();
  });
  draw();
};

LABS.vline = host => {
  const G = {
    'y = x²':           { f:x => x*x },
    'y = |x| − 1':      { f:x => Math.abs(x) - 1 },
    'y = x³ − 3x':      { f:x => x*x*x - 3*x },
    'y = 2x + 1':       { f:x => 2*x + 1 },
    'x² + y² = 9 (원)': { up:x => Math.sqrt(9 - x*x), dn:x => -Math.sqrt(9 - x*x) },
    'x = y² (옆으로 누운 포물선)': { up:x => Math.sqrt(x), dn:x => -Math.sqrt(x) },
    'y = 2 (상수)':      { f:x => 2 }
  };
  host.innerHTML = `<div style="font-weight:900">📏 세로선(수직선) 테스트 — 세로선을 움직이며 그래프와 몇 번 만나는지 세어 봐요</div><div class="pl"></div>`;
  const ctr = document.createElement('div'); ctr.className = 'ctr';
  ctr.innerHTML = `<label>그래프 <select>${Object.keys(G).map(k => `<option>${k}</option>`).join('')}</select></label>
    <label>세로선 x = <input type="range" min="-5" max="5" step="0.1" value="1"> <b>1</b></label>
    <label><input type="checkbox"> 가로선 테스트도 하기 (y = <input type="range" min="-5" max="5" step="0.1" value="1" class="hy"> <b class="hb">1</b>)</label>`;
  host.appendChild(ctr);
  const out = document.createElement('div'); out.className = 'out'; host.appendChild(out);
  const sel = $('select', ctr), rx = $$('input[type=range]', ctr)[0], cb = $('input[type=checkbox]', ctr), ry = $('.hy', ctr);
  function draw(){
    const g = G[sel.value], a = +rx.value, b = +ry.value;
    $$('b', ctr)[0].textContent = a; $('.hb', ctr).textContent = b;
    const P = makePlot($('.pl', host), { w:440, h:330, xr:[-6,6], yr:[-5,5] });
    if (g.f) P.fn(g.f, '#ff7ba9'); else { P.fn(g.up, '#ff7ba9'); P.fn(g.dn, '#ff7ba9'); }
    P.line(a, -5, a, 5, '#3aa6f2', [6,4], 2.2);
    let hits = [];
    if (g.f) hits = [[a, g.f(a)]];
    else { const u = g.up(a), d = g.dn(a); if (isFinite(u)){ hits.push([a,u]); if (Math.abs(u - d) > 1e-9) hits.push([a,d]); } }
    hits.forEach(h => P.dot(h[0], h[1], '#3aa6f2'));
    let txt = `세로선 \\(x=${a}\\) 과(와) 만나는 점 : <b>${hits.length}개</b> → ` +
      (g.f ? '어디서 그어도 꼭 1개 → <b>함수의 그래프</b>' : hits.length >= 2 ? '2개 이상 만나는 곳이 있어요 → <b>함수의 그래프가 아니에요</b>' : '이 위치에서는 1개 이하지만, 다른 곳에서 2개 만나요!');
    if (cb.checked && g.f){
      P.line(-6, b, 6, b, '#2bbf9e', [6,4], 2.2);
      let n = 0, prev = g.f(-6) - b;
      for (let x = -6; x <= 6; x += 0.002){ const v = g.f(x) - b; if (v === 0 || prev * v < 0){ n++; P.dot(x, b, '#2bbf9e'); } prev = v; }
      txt += `<br>가로선 \\(y=${b}\\) 과(와) 만나는 점 : <b>${n}개</b> ` + (n >= 2 ? '→ 같은 함숫값을 갖는 x가 여러 개 → <b>일대일함수 아님</b>' : '');
    }
    out.innerHTML = txt; tex(out);
  }
  [sel, rx, cb, ry].forEach(e => e.oninput = draw); sel.onchange = draw;
  draw();
};

LABS.mirror = host => {
  const FAM = {
    'y = ax + b':        { f:(x,a,b) => a*x + b, ok:(a) => a !== 0 },
    'y = x² (x ≥ 0)':    { f:(x) => x >= 0 ? x*x : NaN, ok:() => true },
    'y = x³':            { f:(x) => x*x*x, ok:() => true },
    'y = x² (모든 실수)':  { f:(x) => x*x, ok:() => false }
  };
  host.innerHTML = `<div style="font-weight:900">🪞 역함수 거울 — 점 \\((t,\\,f(t))\\) 를 직선 \\(y=x\\) 에 비추면?</div><div class="pl"></div>
    <div class="ctr"><label>함수 <select>${Object.keys(FAM).map(k => `<option>${k}</option>`).join('')}</select></label></div>`;
  const V = sliders(host, [{k:'a',l:'a',min:-3,max:3,s:0.5,v:2},{k:'b',l:'b',min:-4,max:4,s:0.5,v:1},{k:'t',l:'점 t',min:-3,max:3,s:0.1,v:1}], () => draw());
  const out = document.createElement('div'); out.className = 'out'; host.appendChild(out);
  const sel = $('select', host);
  function draw(){
    const F = FAM[sel.value], f = x => F.f(x, V.a, V.b);
    const P = makePlot($('.pl', host), { w:440, h:380, xr:[-6,6], yr:[-6,6] });
    P.fn(x => x, '#b4abc6', { dash:[6,5], lw:1.6 });
    P.fn(f, '#ff7ba9');
    const ok = F.ok(V.a);
    // 역함수 그래프 = 점들을 뒤집어 그린다
    const c = P.c; c.strokeStyle = ok ? '#3aa6f2' : '#c7c2d2'; c.lineWidth = 2.6; c.setLineDash(ok ? [] : [4,4]);
    c.beginPath(); let pen = false;
    for (let i = 0; i <= 900; i++){ const x = -6 + 12*i/900, y = f(x);
      if (!isFinite(y) || Math.abs(y) > 50){ pen = false; continue; }
      const sx = P.X(y), sy = P.Y(x); if (!pen){ c.moveTo(sx, sy); pen = true; } else c.lineTo(sx, sy); }
    c.stroke(); c.setLineDash([]);
    const t = V.t, ft = f(t);
    if (isFinite(ft)){ P.dot(t, ft, '#ff5f9e', `(${fmt(t)}, ${fmt(ft)})`); P.dot(ft, t, '#3aa6f2', `(${fmt(ft)}, ${fmt(t)})`); P.line(t, ft, ft, t, '#9b7cf6', [3,3], 1.4); }

function mapFig(host, list){
  host.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center';
  host.innerHTML = list.map(d => {
    const n = Math.max(d.X.length, d.Y.length), h = 40 + n*34;
    const px = i => 22 + 34*i + (n - d.X.length)*17 + 18, py = i => 22 + 34*i + (n - d.Y.length)*17 + 18;
    let s = `<svg viewBox="0 0 190 ${h + 10}" style="width:180px"><defs><marker id="m${d.t}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2a9ad8"/></marker></defs>
      <text x="4" y="14" font-size="13" font-weight="700">${d.t}</text>
      <ellipse cx="50" cy="${h/2 + 8}" rx="26" ry="${h/2 - 4}" fill="none" stroke="#333"/><ellipse cx="150" cy="${h/2 + 8}" rx="26" ry="${h/2 - 4}" fill="none" stroke="#333"/>
      <text x="45" y="12" font-style="italic" font-size="13">${d.xl || 'X'}</text><text x="145" y="12" font-style="italic" font-size="13">${d.yl || 'Y'}</text>`;
    d.arrows.forEach(([a,b]) => { s += `<line x1="56" y1="${px(d.X.indexOf(a))}" x2="140" y2="${py(d.Y.indexOf(b))}" stroke="#2a9ad8" stroke-width="1.6" marker-end="url(#m${d.t})"/>`; });
    d.X.forEach((x,i) => { s += `<circle cx="54" cy="${px(i)}" r="2.6"/><text x="${44 - String(x).length*5}" y="${px(i)+4}" font-size="12">${x}</text>`; });
    d.Y.forEach((y,i) => { s += `<circle cx="146" cy="${py(i)}" r="2.6"/><text x="151" y="${py(i)+4}" font-size="12" font-style="italic">${y}</text>`; });
    return s + '</svg>';
  }).join('');
}

function bindTilt(root){
  $$('.tilt, .scene .stage', root || document).forEach(el => {
    if (el._tilt) return; el._tilt = 1;
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      el.style.setProperty('--ry', (x * 10).toFixed(2) + 'deg'); el.style.setProperty('--rx', (-y * 8).toFixed(2) + 'deg');
      el.style.setProperty('--gx', ((x + .5) * 100).toFixed(0) + '%'); el.style.setProperty('--gy', ((y + .5) * 100).toFixed(0) + '%');
    });
    el.addEventListener('pointerleave', () => { el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg'); });
  });
}

};
const flowOf = id => ((FLOW[LESSON.code] || {})[id]) || { ex:null, chk:[] };
const inFlow = () => { const set = new Set(); Object.values(FLOW[LESSON.code] || {}).forEach(f => { if (f.ex) set.add(f.ex); f.chk.forEach(x => set.add(x)); }); return set; };

function narr(k){
  const a = (typeof AUD !== 'undefined') && AUD[k];
  if (!a) return '';
  return `<div class="narr" data-k="${k}">
    <button class="nbtn" type="button" aria-label="성우가 읽어주기"><span class="ni">▶</span><span class="nt">🎧 성우가 읽어주기</span></button>
    <div class="ninfo"><b>${a.ic} ${a.who}</b><span>${a.mood}</span>
      <div class="nbar"><div class="nfill"></div></div>
      <div class="nmeta"><span class="ntime">0:00</span><span class="nspd">
        <button type="button" data-s="0.85">느리게</button><button type="button" data-s="1" class="on">보통</button><button type="button" data-s="1.15">빠르게</button></span></div>
      <small class="nai">🤖 AI 음성 (Higgsfield · Qwen TTS) — 실제 성우·저자의 목소리가 아니에요</small>
    </div></div>`;
}
let NARR_A = null, NARR_EL = null;
function fmtT(t){ t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function narrStop(){
  if (NARR_A){ NARR_A.pause(); }
  if (NARR_EL){ NARR_EL.classList.remove('play'); NARR_EL.querySelector('.ni').textContent = '▶'; NARR_EL.querySelector('.nt').textContent = '🎧 이어서 듣기'; NARR_EL.closest('.book')?.classList.remove('reading'); }
}
function bindNarr(root){
  (root || document).querySelectorAll('.narr').forEach(el => {
    const k = el.dataset.k, a = AUD[k];
    el.querySelector('.nbtn').onclick = () => {
      if (NARR_EL === el && NARR_A && !NARR_A.paused){ narrStop(); return; }
      if (NARR_EL !== el){
        narrStop();
        if (NARR_A){ NARR_A.src = ''; }
        NARR_A = new Audio(a.url); NARR_A.preload = 'auto'; NARR_EL = el;
        const spd = el.querySelector('.nspd .on'); NARR_A.playbackRate = +(spd ? spd.dataset.s : 1);
        NARR_A.ontimeupdate = () => {
          if (NARR_EL !== el) return;
          const d = NARR_A.duration || 0;
          el.querySelector('.nfill').style.width = (d ? NARR_A.currentTime / d * 100 : 0) + '%';
          el.querySelector('.ntime').textContent = fmtT(NARR_A.currentTime) + (d ? ' / ' + fmtT(d) : '');
        };
        NARR_A.onended = () => { narrStop(); el.querySelector('.nt').textContent = '🎧 다시 듣기'; el.querySelector('.nfill').style.width = '100%'; NARR_A = null; NARR_EL = null; };
        NARR_A.onerror = () => { el.classList.remove('play'); el.querySelector('.ni').textContent = '!'; el.querySelector('.nt').textContent = '음성을 불러오지 못했어요'; snack('인터넷 연결을 확인해 주세요 (음성은 인터넷에서 불러와요)'); };
      }
      NARR_A.play().then(() => {
        el.classList.add('play'); el.querySelector('.ni').textContent = '❚❚'; el.querySelector('.nt').textContent = '잠깐 멈추기';
        el.closest('.book')?.classList.add('reading');
      }).catch(() => {});
    };
    el.querySelector('.nbar').onclick = e => {
      if (NARR_EL !== el || !NARR_A || !NARR_A.duration) return;
      const r = e.currentTarget.getBoundingClientRect();
      NARR_A.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * NARR_A.duration;
    };
    el.querySelectorAll('.nspd button').forEach(b => b.onclick = () => {
      el.querySelectorAll('.nspd button').forEach(x => x.classList.toggle('on', x === b));
      if (NARR_EL === el && NARR_A) NARR_A.playbackRate = +b.dataset.s;
    });
  });
}

// ---------- 가로로 넘기는 영역 : 마우스로 끌기 · 휠 · 화살표 ----------
function dragScroll(el, opt){
  if (!el || el._ds) return; el._ds = 1;
  let down = false, sx = 0, sl = 0, moved = false, pid = null;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;          // 터치는 브라우저 기본 스크롤 사용
    if (el.scrollWidth <= el.clientWidth + 2) return;
    down = true; moved = false; sx = e.clientX; sl = el.scrollLeft; pid = e.pointerId;
  });
  window.addEventListener('pointermove', e => {
    if (!down || e.pointerId !== pid) return;
    const dx = e.clientX - sx;
    if (!moved && Math.abs(dx) > 6){ moved = true; el.classList.add('dragging'); }
    if (moved){ el.scrollLeft = sl - dx; e.preventDefault(); }
  });
  const up = () => { if (!down) return; down = false; setTimeout(() => el.classList.remove('dragging'), 0); };
  window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  el.addEventListener('click', e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  if (opt && opt.wheel) el.addEventListener('wheel', e => {
    if (el.scrollWidth <= el.clientWidth + 2) return;
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){ el.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive:false });
}
function initTabScroll(){
  const bar = $('#tabbar'), nav = bar.parentElement;
  nav.style.position = 'sticky';

function tAbsent(){
  if (!RLIST) return `<p class="lead" style="font-size:.84rem;margin-top:8px">📋 위쪽 「명렬표 불러오기」로 학교 명렬표 엑셀을 불러오면, 반마다 <b>아직 들어오지 않은 학생</b>과 <b>명렬표와 이름이 다른 학번</b>을 여기에서 볼 수 있어요.</p>`;
  const cl = tCls === 'all' ? ['1','2','3','4'] : tCls === 'etc' ? [] : [tCls];
  const st = TD.students || [];
  return cl.map(c => { const R0 = RLIST[c] || []; const miss = R0.filter(([no]) => !st.some(x => x.student_no === no));
    const odd = st.filter(x => clsOf(x.student_no) === c).filter(x => { const r = R0.find(([no]) => no === x.student_no); return !r || r[1] !== x.name; });
    return `<div class="tabsent"><b>${c}반</b> 참여 ${R0.length - miss.length} / ${R0.length}명
      ${miss.length ? `<div>🙋 아직 안 들어온 학생 (${miss.length}) : ${miss.map(([no, nm]) => `<span>${esc(no)} ${esc(nm)}</span>`).join('')}</div>` : '<div>🎉 모두 참여했어요</div>'}
      ${odd.length ? `<div class="odd">⚠️ 명렬표와 학번·이름이 다른 입장 : ${odd.map(x => { const r = R0.find(([no]) => no === x.student_no); return `<span>${esc(x.student_no)} ${esc(x.name)}${r ? ` (명렬표 : ${esc(r[1])})` : ' (명렬표에 없는 학번)'}</span>`; }).join('')}</div>` : ''}</div>`; }).join('');
}
/* 명렬표 엑셀 읽기 — 파일은 서버로 보내지 않고 이 브라우저(localStorage)에만 저장 */
async function tReadRoster(file){
  try{
    let rows;
    if (/\.csv$/i.test(file.name)) rows = (await file.text()).split(/\r?\n/).map(l => l.split(','));
    else {
      if (!window.XLSX){ snack('엑셀 읽기 도구를 불러오는 중…'); await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => no(new Error('엑셀 읽기 도구를 불러오지 못했어요 (인터넷 확인)')); document.head.appendChild(sc); }); }
      const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
      const name = wb.SheetNames.find(n => /^1\s*학년/.test(n)) || wb.SheetNames[0];
      rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:false, defval:'' });
    }
    const out = {};
    rows.forEach(r => r.forEach((v, i) => {
      const no = String(v).trim(), nm = String(r[i + 1] || '').trim(), note = String(r[i + 2] || '');
      if (/^1\d{4}$/.test(no) && nm && !/^\d+$/.test(nm) && !/자퇴|전출|퇴학|제적/.test(note)){ const c = clsOf(no); if (['1','2','3','4'].includes(c)) (out[c] = out[c] || []).push([no, nm]); }
    }));
    const tot = Object.values(out).reduce((a, b) => a + b.length, 0);
    if (!tot) throw new Error('1학년 1~4반 학번(1반번호 5자리)과 이름을 찾지 못했어요');
    RLIST = out; try{ localStorage.setItem('qf_roster', JSON.stringify(out)); }catch(e){}
    snack(`📋 명렬표를 불러왔어요 : ${['1','2','3','4'].map(c => `${c}반 ${(out[c] || []).length}명`).join(' · ')} (이 컴퓨터에만 저장)`);
    tRender();
  }catch(e){ snack('명렬표를 읽지 못했어요 : ' + e.message); }
}

      <td>${o.ev.length ? (o.ev.reduce((a, b) => a + b, 0) / o.ev.length).toFixed(1) + ' / ' + Math.max(...o.ev) : '-'}</td><td>${o.cr}</td><td>${o.co}</td><td>${o.no}</td></tr>`).join('') || '<tr><td colspan="7">아직 기록이 없어요.</td></tr>'}
    </table></div>
    <div class="filters" id="taiMode" style="margin-top:12px">${[['all','전체'], ...Object.entries(MD)].map(([k, t]) => `<button class="fbtn${tAiMode === k ? ' on' : ''}" data-v="${k}">${t}</button>`).join('')}
      <button class="fbtn" id="taiCsv" type="button">⬇ 코치 기록 CSV</button></div>
    <div class="tscroll"><table class="tt"><tr><th>시각</th><th>학생</th><th>기능</th><th>학생이 보낸 글</th><th>결과 요약</th></tr>
    ${list.slice(0, 300).map(a => `<tr><td>${new Date(a.created_at).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })}</td>
      <td>${esc(a.student_no)} ${esc(nameOf(a.student_no))}</td><td>${MD[a.mode] || a.mode}</td><td style="white-space:normal;min-width:220px">${esc((a.mode === 'note' ? '(노트) ' : '') + (a.input || '').slice(0, 160))}</td>
      <td style="white-space:normal;min-width:260px">${brief(a)}</td></tr>`).join('')}</table></div>`;
  tex(V);
  $$('#taiMode .fbtn[data-v]', V).forEach(b => b.onclick = () => { tAiMode = b.dataset.v; tAI(V); });
  $('#taiCsv').onclick = () => {
    const rows = [['시각','학번','이름','기능','학생 글','결과(JSON)']];
    A.forEach(a => rows.push([a.created_at, a.student_no, nameOf(a.student_no), MD[a.mode] || a.mode, a.input, JSON.stringify(a.output)]));
    csvDown(rows, `질문코치기록_${TL}_${tClsName()}.csv`);
  };
}
function csvDown(rows, name){
  const csv = '\ufeff' + rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

;
/* ===================================================================
   🧑‍🏫 선생님으로 입장 + 🔔 새 질문 실시간 알림
   · 암호는 이 브라우저 창(sessionStorage)에만 잠깐 보관 — 브라우저를 닫으면 사라짐
   · 15초마다 서버에 「지난번 이후 새 글」을 물어봄 (qf_teacher_new, 암호가 맞을 때만 응답)
   · 새 글 하나마다 음 하나 — 여러 개가 들어오면 박자에 맞춰 이어져 멜로디가 됨 (직접 만든 곡)
   =================================================================== */
const TM = { on:false, pass:'', since:null, seen:new Set(), items:[], unread:0, timer:null, busy:false,
  snd:true, step:0, qNotes:0, nextAt:0, title:document.title };
try { TM.snd = localStorage.getItem('qf_tbell_snd') !== 'off'; } catch (e) {}

const TM_KIND = { concept:'개념 질문', problem:'문제 질문', life:'실생활 질문', book:'책 속 질문', free:'자유 질문(익명)', reply:'답글',
  q:'소그룹 질문', r:'소그룹 답', chat:'소그룹 토론', result:'소그룹 해결 결과' };
const TM_LNAME = { f1:'1차시 함수', f2:'2차시 합성함수', f3:'3차시 역함수', r1:'유리함수 1', r2:'유리함수 2', r3:'무리함수' };

/* ---------- 🎵 알림 멜로디 : 직접 만든 밝은 8마디 (128 BPM, 8분음표 한 칸에 알림 하나) ---------- */
const TM_BPM = 128, TM_STEP = 60 / TM_BPM / 2;
const TM_MEL = [   // [미디 음 번호, 베이스 음] — 펜타토닉 위주의 원곡 멜로디
  [76,48],[79,0],[81,0],[79,0],[84,53],[81,0],[79,0],[76,0],
  [74,55],[76,0],[79,0],[81,0],[79,48],[76,0],[74,0],[72,0],
  [76,48],[79,0],[84,0],[83,0],[81,53],[79,0],[81,0],[84,0],
  [86,55],[84,0],[81,0],[79,0],[76,48],[79,0],[72,0],[0,48]
];
const mHz = m => 440 * Math.pow(2, (m - 69) / 12);
function tmChime(n){
  if (!TM.snd || !n) return;
  const c = SND.boot(); if (!c) return;
  const now = c.currentTime;
  if (TM.nextAt < now + 0.03) TM.nextAt = now + 0.03;          // 쉬고 있었으면 바로 시작, 울리는 중이면 다음 박에 이어 붙임
  n = Math.min(n, 32);                                          // 한꺼번에 너무 많으면 한 바퀴(32박)까지만
  for (let i = 0; i < n; i++){
    const [m, b] = TM_MEL[TM.step % TM_MEL.length], at = TM.nextAt - now;
    if (m){ SND.note(mHz(m), at, TM_STEP * 1.6, { type:'triangle', vol:0.2 }); SND.note(mHz(m + 12), at, TM_STEP * 0.7, { type:'sine', vol:0.045 }); }
    if (b){ SND.note(mHz(b), at, TM_STEP * 2.6, { type:'sine', vol:0.16 }); SND.note(120, at, 0.12, { type:'sine', vol:0.22, slide:-70 }); }   // 낮은 음 + 북
    if (TM.step % 2 === 1) SND.note(5200, at, 0.03, { type:'square', vol:0.012 });                          // 하이햇 느낌
    TM.step++; TM.nextAt += TM_STEP;
  }
}

/* ---------- 입장 화면 : 학생 ↔ 선생님 전환 ---------- */
function tmGateMode(teacher){
  $('#gSBox').hidden = !!teacher; $('#gTBox').hidden = !teacher; $('#gTeacher').hidden = !!teacher;
  $('#gTitle').textContent = teacher ? '선생님으로 입장' : '질문 탐구 교실';
  $('#gSub').textContent = teacher ? '선생님 암호를 넣으면 수업 진행 화면과 새 질문 알림이 켜져요.' : '학번과 이름을 적고 시작해요!';
  $('#gMsg').textContent = '';
  setTimeout(() => (teacher ? $('#gTPass') : $('#gNo')).focus(), 60);
}
async function tmLogin(pass, quiet){
  const msg = $('#gMsg');
  pass = (pass || '').trim();
  if (!pass){ if (!quiet) msg.textContent = '암호를 입력해 주세요.'; return false; }
  if (!quiet) msg.textContent = '확인하는 중…';
  try {
    const r = await rpc('qf_teacher_new', { p_pass:pass, p_since:new Date().toISOString() });
    TM.since = (r && r.now) || new Date().toISOString();
  } catch (e) {
    if (!quiet) msg.textContent = /암호/.test(e.message) ? '암호가 올바르지 않습니다.' : '서버에 연결하지 못했어요. 잠시 뒤 다시 해 주세요.';
    if (quiet && /암호/.test(e.message)){ try { sessionStorage.removeItem('qf_tpass'); } catch (x) {} }
    return false;
  }
  TM.on = true; TM.pass = pass;
  try { sessionStorage.setItem('qf_tpass', pass); } catch (e) {}
  document.documentElement.classList.add('tmode');
  msg.textContent = ''; closeGate(); tmPaint();
  SND.boot();
  if (!quiet){
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
    tmChime(4);                                                  // 입장 신호 (멜로디 첫 마디 반)
    snack('🧑‍🏫 선생님으로 입장했어요. 학생이 글을 올리면 🔔 알림이 와요.');
  }
  if (BCLS === null) BCLS = 'all';
  loadBoard();
  if ($('#tPass')){ $('#tPass').value = pass; tLoad(pass, LESSON.code); }   // 선생님 탭을 미리 열어 둠
  clearInterval(TM.timer); TM.timer = setInterval(tmPoll, 15000);
  return true;
}
function tmLogout(){
  clearInterval(TM.timer); TM.on = false; TM.pass = ''; TM.items = []; TM.unread = 0; TM.seen.clear();
  try { sessionStorage.removeItem('qf_tpass'); } catch (e) {}
  document.documentElement.classList.remove('tmode');
  if ($('#tPass')) $('#tPass').value = '';
  TD = TDALL = null; if ($('#tBody')){ $('#tBody').style.display = 'none'; $('#tBody').innerHTML = ''; }
  tmPaint(); document.title = TM.title; paintMe(); $('#meSwitch').textContent = '바꾸기';
  snack('선생님 화면에서 나왔어요.'); openGate(); tmGateMode(false);
}
function tmPaint(){
  const b = $('#tBell'); if (b){ b.hidden = !TM.on; b.querySelector('i').textContent = TM.unread > 99 ? '99+' : TM.unread; b.classList.toggle('has', TM.unread > 0); }
  if (TM.on){ $('#meNo').textContent = '교사'; $('#meName').textContent = '🧑‍🏫 선생님'; $('#meSwitch').textContent = '로그아웃'; }
  document.title = (TM.on && TM.unread ? `(${TM.unread}) ` : '') + TM.title;
  if ($('#tBellPanel') && !$('#tBellPanel').hidden) tmPanel();
}

/* ---------- 새 글 확인 (15초마다) ---------- */
async function tmPoll(){
  if (!TM.on || TM.busy) return; TM.busy = true;
  try {
    const r = await rpc('qf_teacher_new', { p_pass:TM.pass, p_since:TM.since });
    TM.since = r.now || TM.since;
    const fresh = [...(r.posts || []), ...(r.gposts || [])]
      .filter(x => { const k = x.src + x.id; if (TM.seen.has(k)) return false; TM.seen.add(k); return true; })
      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    if (fresh.length) tmArrive(fresh);
    netState(true);
  } catch (e) {
    if (/암호/.test(e.message)){ snack('선생님 암호가 바뀌었어요. 다시 입장해 주세요.'); tmLogout(); }
    else netState(false);
  } finally { TM.busy = false; }
}
function tmArrive(list){
  TM.items = list.slice().reverse().concat(TM.items).slice(0, 80);
  list.forEach(x => { if (x.src === 'post' && x.kind !== 'free' && x.lesson === LESSON.code) TNAMES[x.id] = [x.student_no, x.name]; }); loadBoard();
  TM.unread += list.length; tmPaint(); tmChime(list.length);
  const b = $('#tBell'); if (b){ b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring'); }
  const byCls = {}; list.forEach(x => { const k = x.cls ? x.cls + '반' : (x.kind === 'free' ? '익명' : '기타'); byCls[k] = (byCls[k] || 0) + 1; });
  const sum = Object.entries(byCls).map(([k, n]) => `${k} ${n}`).join(' · ');
  tmToast(`🔔 새 글 ${list.length}개`, sum, list[list.length - 1]);
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted'){
    try { const x = list[list.length - 1];
      const n = new Notification(`질문 탐구 교실 · 새 글 ${list.length}개`, { body:`${sum}\n${tmWho(x)} : ${x.body}`, tag:'qf-teacher', renotify:true });
      n.onclick = () => { window.focus(); tmOpenPanel(); n.close(); };
    } catch (e) {}
  }
  if (CUR === 'teacher' && TL && TP){ const m = $('#tMsg'); if (m){ m.className = 'cmsg ok'; m.innerHTML = `🔔 새 글 ${TM.unread}개가 들어왔어요. <button type="button" class="btn" id="tmRe" style="padding:4px 12px">↻ 반영하기</button>`; $('#tmRe').onclick = () => { tLoad(TP, TL); tmRead(); }; } }
}
const tmWho = x => x.kind === 'free' ? '익명' : `${x.cls ? x.cls + '반 ' : ''}${x.name || ''}`;
const tmAgo = t => { const s = Math.max(0, (Date.now() - new Date(t)) / 1000); return s < 60 ? '방금' : s < 3600 ? Math.floor(s / 60) + '분 전' : Math.floor(s / 3600) + '시간 전'; };

/* ---------- 알림 띠 · 알림 목록 ---------- */
function tmToast(big, sm, last){
  let t = $('#tmToast');
  if (!t){ t = document.createElement('button'); t.type = 'button'; t.id = 'tmToast'; document.body.appendChild(t); t.onclick = () => { t.classList.remove('on'); tmOpenPanel(); }; }
  t.innerHTML = `<b>${big}</b><span>${esc(sm)}</span>${last ? `<em>${esc(tmWho(last))} · ${esc(TM_KIND[last.kind] || '')} : ${esc(last.body)}</em>` : ''}`;
  t.classList.remove('on'); void t.offsetWidth; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 7000);
}
function tmOpenPanel(){
  let p = $('#tBellPanel');
  if (!p){ p = document.createElement('div'); p.id = 'tBellPanel'; p.hidden = true; document.body.appendChild(p);
    document.addEventListener('pointerdown', e => { if (!p.hidden && !p.contains(e.target) && !e.target.closest('#tBell')) p.hidden = true; }); }
  p.hidden = !p.hidden; if (!p.hidden){ const t = $('#tmToast'); if (t) t.classList.remove('on'); tmPanel(); tmRead(); }
}
function tmRead(){ TM.unread = 0; tmPaint(); }
function tmPanel(){
  const p = $('#tBellPanel'); if (!p) return;
  p.innerHTML = `<div class="tbp-h"><b>🔔 새로 올라온 글</b>
      <button type="button" class="tbp-s" id="tbpSnd" title="알림 멜로디 켜기/끄기">${TM.snd ? '🎵 멜로디 켜짐' : '🔕 멜로디 꺼짐'}</button></div>
    <div class="tbp-l">${TM.items.length ? TM.items.map(x => `
      <button type="button" class="tbp-i" data-l="${x.lesson}"><span class="tbp-k">${esc(TM_KIND[x.kind] || x.kind)}${x.lesson !== LESSON.code ? ` · ${esc(TM_LNAME[x.lesson] || x.lesson)}` : ''}</span>
        <b>${esc(tmWho(x))}${x.grp ? ` · ${x.grp}모둠` : ''}</b><span class="tbp-b">${esc(x.body)}</span><small>${tmAgo(x.created_at)}</small></button>`).join('')
      : '<p class="tbp-e">아직 새 글이 없어요. 학생이 글을 올리면 15초 안에 여기에 나타나고 멜로디가 한 음씩 울려요.</p>'}</div>
    <div class="tbp-f"><button type="button" class="btn" id="tbpTeach">🧑‍🏫 선생님 화면 열기</button><button type="button" class="btn" id="tbpTest">🎵 소리 시험</button></div>`;
  $('#tbpSnd').onclick = () => { TM.snd = !TM.snd; try { localStorage.setItem('qf_tbell_snd', TM.snd ? 'on' : 'off'); } catch (e) {} tmPanel(); if (TM.snd) tmChime(2); };
  $('#tbpTest').onclick = () => { const s = TM.snd; TM.snd = true; tmChime(8); TM.snd = s; };
  $('#tbpTeach').onclick = () => { p.hidden = true; go('teacher'); if (TM.pass) tLoad(TM.pass, LESSON.code); };
  $$('.tbp-i', p).forEach(b => b.onclick = () => {
    if (b.dataset.l === LESSON.code){ p.hidden = true; go('teacher'); tLoad(TM.pass, LESSON.code); }
    else location.href = b.dataset.l + '.html';                 // 다른 차시 글 → 그 차시로 (선생님 입장은 유지)
  });
}

/* ---------- 시작 ---------- */
function bootTMode(){
  TM.title = document.title.replace(/^\(\d+\+?\) /, '');
  const tools = $('.hdtools');
  if (tools && !$('#tBell')){
    const b = document.createElement('button'); b.type = 'button'; b.id = 'tBell'; b.className = 'sndbtn tbell'; b.hidden = true; b.title = '새 질문 알림';
    b.innerHTML = '🔔<i>0</i>'; b.onclick = tmOpenPanel; tools.insertBefore(b, tools.firstChild);
  }
  $('#gTeacher').onclick = () => tmGateMode(true);
  $('#gTBack').onclick = () => tmGateMode(false);
  $('#gTGo').onclick = () => tmLogin($('#gTPass').value);
  $('#gTPass').onkeydown = e => { if (e.key === 'Enter') $('#gTGo').click(); };
  $('#meSwitch').onclick = () => TM.on ? tmLogout() : (openGate(), tmGateMode(false));
  let saved = ''; try { saved = sessionStorage.getItem('qf_tpass') || ''; } catch (e) {}
  if (saved){ closeGate(); tmLogin(saved, true).then(ok => { if (!ok && !ME.no){ openGate(); tmGateMode(true); } }); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && TM.on) tmPoll(); });
}
