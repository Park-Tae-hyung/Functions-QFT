<style>
/* ===================================================================
   명제 탐험대 — 파스텔 라이트 테마
   =================================================================== */
:root{
  --pink:#ff7ba9;      --pink-s:#ffe3ed;
  --lav:#a98cff;       --lav-s:#ece4ff;
  --mint:#3fcfb4;      --mint-s:#d9f7f0;
  --sky:#6fc3ff;       --sky-s:#def0ff;
  --butter:#ffc94d;    --butter-s:#fff2d2;
  --coral:#ff8a7a;

  --ink:#4a3f5c;       --ink2:#8a7fa3;      --ink3:#b4abc6;
  --line:#f0e8f6;      --line2:#e3d9ee;
  --card:#ffffff;
  --r:22px;
  --sh:0 6px 22px rgba(169,140,255,.10), 0 2px 6px rgba(255,123,169,.07);
  --sh-h:0 14px 34px rgba(169,140,255,.20), 0 4px 10px rgba(255,123,169,.12);
  --grad:linear-gradient(100deg,#ff7ba9,#a98cff);
  --grad2:linear-gradient(100deg,#6fc3ff,#3fcfb4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(760px 420px at 6% -4%,  #ffe6f1 0%, transparent 62%),
    radial-gradient(700px 400px at 96% 2%,  #e6ecff 0%, transparent 60%),
    radial-gradient(640px 420px at 50% 102%,#ddf7f1 0%, transparent 62%),
    #fffafc;
  background-attachment:fixed;
  color:var(--ink);
  font-family:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px; line-height:1.78; min-height:100vh; -webkit-text-size-adjust:100%;
}
a{color:#e85c93}
.wrap{max-width:1020px;margin:0 auto;padding:0 18px}

/* ---------- 헤더 ---------- */
header{position:relative;overflow:hidden}
header::before{content:'';position:absolute;inset:-60px -40px auto -40px;height:230px;
  background:linear-gradient(120deg,#ffd9e8 0%,#e7dcff 48%,#d6f3ff 100%);
  border-radius:0 0 50% 50%/0 0 34px 34px;opacity:.55;filter:blur(2px)}
.hd{position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 0 14px}
.logo{font-size:40px;line-height:1;filter:drop-shadow(0 4px 10px rgba(255,123,169,.4));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.hd h1{margin:0;font-size:1.5rem;font-weight:900;letter-spacing:-.025em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hd h1 small{display:block;font-size:.72rem;font-weight:700;color:var(--ink2);margin-top:4px;
  letter-spacing:0;-webkit-text-fill-color:var(--ink2)}
.hd .sp{flex:1}
.hdtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--pink-s);
  border-radius:999px;padding:5px 7px 5px 15px;box-shadow:var(--sh)}
.me label{font-size:.78rem;color:var(--pink);font-weight:800;white-space:nowrap}
.me input{background:var(--pink-s);border:none;color:var(--ink);border-radius:999px;
  padding:8px 15px;width:132px;font-family:inherit;font-size:.88rem;font-weight:700;outline:none}
.me input::placeholder{color:#e0a5bf;font-weight:600}
.me input:focus{box-shadow:0 0 0 3px rgba(255,123,169,.26)}
.sndbtn{background:#fff;border:2px solid var(--lav-s);border-radius:999px;width:44px;height:44px;
  font-size:1.1rem;cursor:pointer;box-shadow:var(--sh);transition:.18s;line-height:1}
.sndbtn:hover{transform:translateY(-2px) scale(1.06)}
.sndbtn.off{opacity:.45}

/* 점수판 */
.score{position:relative;display:flex;gap:10px;flex-wrap:wrap;padding:0 0 18px}
.sc{flex:1;min-width:120px;background:var(--card);border:2px solid #fff;border-radius:20px;
  padding:12px 16px;box-shadow:var(--sh)}
.sc:nth-child(1){background:linear-gradient(160deg,#fff,var(--butter-s))}
.sc:nth-child(2){background:linear-gradient(160deg,#fff,var(--mint-s))}
.sc:nth-child(3){background:linear-gradient(160deg,#fff,var(--pink-s))}
.sc:nth-child(4){background:linear-gradient(160deg,#fff,var(--lav-s))}
.sc .k{font-size:.73rem;color:var(--ink2);font-weight:800}
.sc .v{font-size:1.45rem;font-weight:900;line-height:1.3;color:var(--ink)}
.xpbar{height:9px;border-radius:99px;background:#fff;overflow:hidden;margin-top:6px;
  box-shadow:inset 0 1px 3px rgba(74,63,92,.12)}
.xpbar>div{height:100%;width:0;border-radius:99px;background:var(--grad);
  transition:width .7s cubic-bezier(.2,.9,.2,1)}

/* ---------- 탭 ---------- */
nav.tabs{position:sticky;top:0;z-index:40;background:rgba(255,250,252,.9);
  backdrop-filter:blur(14px);border-bottom:2px solid var(--line)}
.tabs-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 18px;max-width:1020px;margin:0 auto}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:#fff;border:2px solid var(--line);color:var(--ink2);font-family:inherit;
  font-size:.86rem;font-weight:800;padding:9px 15px;cursor:pointer;white-space:nowrap;
  border-radius:999px;transition:.18s;box-shadow:0 2px 6px rgba(169,140,255,.07)}
.tab:hover{color:var(--pink);border-color:var(--pink-s);transform:translateY(-2px)}
.tab.on{color:#fff;background:var(--grad);border-color:transparent;
  box-shadow:0 6px 16px rgba(255,123,169,.38)}
.tab .dot{display:inline-block;margin-left:6px;background:var(--lav-s);color:var(--lav);
  border-radius:99px;padding:1px 8px;font-size:.72rem;font-weight:900}
.tab.on .dot{background:rgba(255,255,255,.95);color:var(--pink)}
.tab .dot.full{background:var(--mint);color:#fff}
.tab.on .dot.full{background:#fff;color:var(--mint)}

/* ---------- 페이지 ---------- */
.page{display:none;padding:24px 0 72px;animation:fade .34s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:2px solid #fff;border-radius:var(--r);
  padding:20px 24px;margin:0 0 16px;box-shadow:var(--sh)}
.card h2{margin:0 0 12px;font-size:1.08rem;font-weight:900;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{background:var(--grad);color:#fff;font-size:.71rem;font-weight:900;
  padding:4px 13px;border-radius:999px;box-shadow:0 3px 9px rgba(255,123,169,.32)}
.lead{color:var(--ink2);margin:0 0 10px;font-size:.95rem}
.lead b,.card b{color:var(--ink)}

.eq{background:linear-gradient(135deg,var(--lav-s),var(--sky-s));border:none;
  border-radius:16px;padding:14px 18px;margin:12px 0;text-align:center;overflow-x:auto;
  box-shadow:inset 0 1px 0 #fff}
.tip{background:linear-gradient(135deg,var(--butter-s),#fffaf0);border:2px dashed #ffd98a;
  border-radius:16px;padding:11px 16px;margin:11px 0;font-size:.9rem;color:#8a6a1f}
.tip b{color:#d98c00}
.choices{background:#fdfaff;border:2px solid var(--line);border-radius:16px;
  padding:12px 17px;margin:11px 0;line-height:2.2}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:11px;margin:12px 0}
.box{background:#fdfaff;border:2px solid var(--line);border-radius:16px;padding:14px 17px;transition:.2s}
.box:hover{border-color:var(--lav-s);transform:translateY(-2px);box-shadow:var(--sh)}
.box b{display:block;color:var(--lav);margin-bottom:5px;font-size:.89rem;font-weight:900}

/* ---------- 문제 카드 ---------- */
.prob{background:var(--card);border:2px solid #fff;border-radius:var(--r);
  padding:20px 24px;margin:0 0 15px;box-shadow:var(--sh);position:relative;
  transition:border-color .3s,box-shadow .3s,transform .2s}
.prob:hover{box-shadow:var(--sh-h)}
.prob.solved{border-color:var(--mint);background:linear-gradient(170deg,#fff,var(--mint-s))}
.prob.solved::after{content:'✓ CLEAR';position:absolute;top:16px;right:20px;
  font-size:.72rem;font-weight:900;color:#fff;background:var(--mint);
  padding:3px 11px;border-radius:999px;box-shadow:0 3px 9px rgba(63,207,180,.4)}
.ptop{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.ptag{font-size:.72rem;font-weight:900;background:var(--lav-s);color:var(--lav);
  padding:4px 12px;border-radius:999px}
.prob.solved .ptag{background:var(--mint);color:#fff}
.lvl{font-size:.68rem;font-weight:900;padding:4px 11px;border-radius:999px}
.lvl.기초{background:var(--sky-s);color:#2f93d6}
.lvl.기본{background:var(--lav-s);color:#7d5fe0}
.lvl.도전{background:var(--pink-s);color:#e8558c}
.pts{margin-left:auto;font-size:.74rem;font-weight:900;color:#d99500;
  background:var(--butter-s);padding:4px 11px;border-radius:999px}
.q{font-size:.98rem;margin:0 0 14px;color:var(--ink)}
.q b{color:#e8558c}

.fields{display:flex;flex-direction:column;gap:11px;margin:14px 0}
.fld{background:#fdfaff;border:2px solid var(--line);border-radius:18px;padding:12px 16px;transition:.22s}
.fld.ok{border-color:var(--mint);background:linear-gradient(140deg,#fff,var(--mint-s))}
.fld.no{border-color:#ffb3c8;background:linear-gradient(140deg,#fff,#fff0f5)}
.fld>.lb{font-size:.86rem;font-weight:800;color:var(--ink2);margin-bottom:9px}
.fld.ok>.lb{color:#1aa98d} .fld.no>.lb{color:#e8558c}
.fld.ok>.lb::after{content:' ✓';color:var(--mint)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:#fff;border:2px solid var(--line2);color:var(--ink);font-family:inherit;
  font-size:.89rem;font-weight:700;padding:9px 16px;border-radius:14px;cursor:pointer;
  transition:.16s;text-align:left;box-shadow:0 2px 5px rgba(169,140,255,.07)}
.opt:hover{border-color:var(--pink);background:var(--pink-s);transform:translateY(-2px)}
.opt.sel{border-color:transparent;background:var(--grad);color:#fff;
  box-shadow:0 6px 16px rgba(255,123,169,.4);transform:translateY(-1px)}
.fld input[type=text]{width:100%;max-width:290px;background:#fff;border:2px solid var(--line2);
  color:var(--ink);border-radius:14px;padding:11px 16px;font-family:inherit;font-size:.96rem;
  font-weight:700;outline:none;transition:.16s}
.fld input::placeholder{color:var(--ink3);font-weight:500}
.fld input:focus{border-color:var(--lav);box-shadow:0 0 0 4px rgba(169,140,255,.18)}

.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{font-family:inherit;font-size:.87rem;font-weight:800;border-radius:14px;padding:10px 20px;
  border:2px solid var(--line2);background:#fff;color:var(--ink2);cursor:pointer;transition:.16s}
.btn:hover{transform:translateY(-2px);border-color:var(--lav);color:var(--lav)}
.btn.main{background:var(--grad);color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(255,123,169,.36)}
.btn.main:hover{color:#fff;box-shadow:0 10px 24px rgba(255,123,169,.46)}
.btn.hint{border-color:#ffd98a;color:#d98c00;background:var(--butter-s)}
.btn.hint:hover{border-color:var(--butter);color:#b87400}

.verdict{margin-top:13px;padding:13px 17px;border-radius:16px;font-weight:800;font-size:.92rem;display:none}
.verdict.ok{display:block;background:linear-gradient(120deg,var(--mint-s),#eefbf8);
  border:2px solid var(--mint);color:#148a73}
.verdict.no{display:block;background:linear-gradient(120deg,#fff0f5,#fff7fa);
  border:2px solid #ffb3c8;color:#d6407a}
.hintbox{display:none;margin-top:12px;background:linear-gradient(135deg,var(--butter-s),#fffdf7);
  border:2px solid #ffd98a;border-radius:18px;padding:14px 18px;font-size:.92rem;color:#7d611c}
.hintbox.on{display:block;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.hstep{margin:9px 0;padding-left:2px}
.hn{display:inline-block;background:var(--butter);color:#fff;font-weight:900;font-size:.7rem;
  padding:3px 11px;border-radius:999px;margin-right:9px;box-shadow:0 2px 6px rgba(255,201,77,.45)}
.hstep b{color:#b87400}
.solbox{display:none;margin-top:12px;background:linear-gradient(135deg,var(--sky-s),#f4fbff);
  border:2px solid #b9e0ff;border-radius:18px;padding:15px 19px;font-size:.93rem}
.solbox.on{display:block;animation:pop .3s ease}
.solbox .st{font-weight:900;color:#2f93d6;margin-bottom:8px;font-size:.86rem}
.keybox{margin-top:12px;background:linear-gradient(135deg,var(--lav-s),#f7f3ff);
  border:2px solid #d7c8ff;border-radius:18px;padding:13px 18px;font-size:.92rem;display:none}
.keybox.on{display:block;animation:pop .3s ease}
.keybox .kt{font-weight:900;color:var(--lav);font-size:.84rem;margin-bottom:5px}

/* 웨이슨 카드 */
.cards{display:flex;gap:13px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.card-w{width:62px;height:90px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:1.75rem;font-weight:900;box-shadow:0 7px 18px rgba(74,63,92,.18);transition:.2s}
.card-w:hover{transform:translateY(-5px) rotate(-3deg)}
.card-w.num{background:#fff;color:var(--ink);border:2px solid var(--line2)}
.card-w.red{background:linear-gradient(145deg,#ff8fb0,#f2416f)}
.card-w.blue{background:linear-gradient(145deg,#8fd0ff,#4a9eea)}

.venn-host,.maze-host{display:flex;justify-content:center;margin:14px 0}
.venn-host canvas,.maze-host canvas{background:#fff;border:2px solid var(--line);
  border-radius:18px;max-width:100%;box-shadow:var(--sh)}

/* ---------- 유튜브 ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:16px}
.vcard{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:2px solid #fff;border-radius:20px;overflow:hidden;box-shadow:var(--sh);transition:.22s}
.vcard:hover{transform:translateY(-6px);box-shadow:var(--sh-h)}
.vthumb{position:relative;aspect-ratio:16/9;overflow:hidden;
  background:linear-gradient(135deg,#ffd9e8,#e0e7ff)}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.6rem;opacity:.6}
.vthumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(74,63,92,.12);transition:.2s}
.vcard:hover .vthumb .play{background:rgba(74,63,92,.02)}
.vthumb .play i{width:56px;height:39px;border-radius:12px;background:#ff2d55;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(255,45,85,.5);transition:.2s}
.vcard:hover .vthumb .play i{transform:scale(1.12)}
.vthumb .play i::after{content:'';border-left:15px solid #fff;border-top:9px solid transparent;
  border-bottom:9px solid transparent;margin-left:4px}
.vbody{padding:14px 16px 16px}
.vbody .vt{font-weight:900;font-size:.95rem;margin-bottom:5px;line-height:1.45}
.vbody .vd{font-size:.82rem;color:var(--ink2);line-height:1.65}
.vbody .vg{display:inline-block;margin-top:9px;font-size:.68rem;font-weight:900;
  background:var(--pink-s);color:#e8558c;padding:3px 11px;border-radius:999px}

/* ---------- 질문 게시판 ---------- */
.ask{display:flex;flex-direction:column;gap:11px}
.ask textarea{width:100%;min-height:94px;background:#fdfaff;border:2px solid var(--line2);
  color:var(--ink);border-radius:18px;padding:14px 17px;font-family:inherit;font-size:.95rem;
  resize:vertical;outline:none;line-height:1.75}
.ask textarea::placeholder{color:var(--ink3)}
.ask textarea:focus{border-color:var(--lav);box-shadow:0 0 0 4px rgba(169,140,255,.16)}
.ask .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ask select{background:#fff;border:2px solid var(--line2);color:var(--ink);border-radius:14px;
  padding:10px 14px;font-family:inherit;font-size:.88rem;font-weight:700;outline:none}
.qlist{display:flex;flex-direction:column;gap:10px}
.qi{display:flex;gap:13px;align-items:flex-start;background:#fdfaff;border:2px solid var(--line);
  border-radius:18px;padding:14px 17px;transition:.2s}
.qi:hover{border-color:var(--lav-s);transform:translateX(3px)}
.qi .rk{flex:0 0 38px;height:38px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-weight:900;font-size:.95rem;background:#fff;
  color:var(--ink3);border:2px solid var(--line)}
.qi.top1 .rk{background:linear-gradient(145deg,#ffe08a,#ffb347);color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(255,179,71,.45)}
.qi.top2 .rk{background:linear-gradient(145deg,#eef1f8,#c3cada);color:#fff;border-color:transparent}
.qi.top3 .rk{background:linear-gradient(145deg,#f5c9a6,#d79763);color:#fff;border-color:transparent}
.qi .qb{flex:1;min-width:0}
.qi .qtx{font-size:.95rem;word-break:break-word}
.qi .qm{font-size:.76rem;color:var(--ink3);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.qi .qm .tp{background:var(--lav-s);color:var(--lav);padding:2px 10px;border-radius:999px;font-weight:900}
.vbtn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;background:#fff;
  border:2px solid var(--line2);border-radius:15px;padding:8px 13px;cursor:pointer;
  color:var(--ink3);font-family:inherit;transition:.16s;min-width:54px}
.vbtn:hover{border-color:var(--pink);color:var(--pink);transform:scale(1.07)}
.vbtn.voted{border-color:var(--pink);background:var(--pink-s);color:var(--pink)}
.vbtn .ic{font-size:1.05rem;line-height:1.2}
.vbtn .n{font-weight:900;font-size:.82rem}

#cloud{width:100%;height:300px;position:relative;overflow:hidden;border-radius:20px;
  background:radial-gradient(540px 280px at 50% 46%,#fff4f9,#fdfaff);border:2px solid var(--line)}
#cloud span{position:absolute;white-space:nowrap;font-weight:900;line-height:1;
  transform:translate(-50%,-50%);transition:.5s cubic-bezier(.2,.9,.2,1);cursor:default}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.bar{display:flex;align-items:center;gap:12px;font-size:.86rem}
.bar .bl{flex:0 0 122px;text-align:right;color:var(--ink2);font-weight:800}
.bar .bt{flex:1;height:24px;border-radius:999px;background:#fff;overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(74,63,92,.1)}
.bar .bt>div{height:100%;border-radius:999px;background:var(--grad2);
  transition:width .8s cubic-bezier(.2,.9,.2,1);min-width:4px}
.bar .bn{flex:0 0 40px;font-weight:900;color:var(--mint)}

.state{text-align:center;color:var(--ink3);padding:28px 10px;font-size:.92rem}
.state.err{color:#e8558c}

/* ---------- 불꽃놀이 · 토스트 ---------- */
#fw{position:fixed;inset:0;pointer-events:none;z-index:9000}
#toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-26px) scale(.9);z-index:9100;
  pointer-events:none;opacity:0;transition:.45s cubic-bezier(.2,1.5,.4,1);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
#toast .big{font-size:2.7rem;font-weight:900;letter-spacing:-.02em;color:#fff;
  background:var(--grad);padding:10px 34px;border-radius:999px;
  box-shadow:0 14px 40px rgba(255,123,169,.5);display:inline-block}
#toast .sm{margin-top:10px;font-size:.98rem;font-weight:800;color:var(--ink);
  background:#fff;padding:7px 20px;border-radius:999px;display:inline-block;
  box-shadow:0 6px 18px rgba(169,140,255,.25)}

footer{color:var(--ink3);font-size:.8rem;text-align:center;padding:24px 18px 44px;line-height:1.95}

/* ---------- KaTeX 크기 보정 ---------- */
.katex{font-size:1.06em}
.eq .katex{font-size:1.16em}
.opt .katex{font-size:1em}

@media (max-width:640px){
  body{font-size:15px}
  .hd h1{font-size:1.2rem}
  .wrap{padding:0 14px}
  .tabs-in{padding:9px 14px}
  .card,.prob{padding:17px 16px}
  .sc{min-width:calc(50% - 5px)}
  .bar .bl{flex:0 0 86px;font-size:.78rem}
  #cloud{height:246px}
  #toast .big{font-size:1.9rem;padding:9px 24px}
}

/* ===================================================================
   입장 화면 · 학생 표시 · 선생님 화면
   =================================================================== */
#gate{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;
  padding:20px;background:
    radial-gradient(700px 400px at 20% 10%, #ffd9e8 0%, transparent 60%),
    radial-gradient(640px 400px at 82% 18%, #e2e0ff 0%, transparent 58%),
    radial-gradient(600px 380px at 50% 96%, #d6f5ee 0%, transparent 60%),
    #fff6fa;
  animation:fade .35s ease}
#gate.hide{display:none}
.gatebox{width:100%;max-width:370px;background:#fff;border-radius:28px;padding:34px 30px 28px;
  box-shadow:0 20px 60px rgba(169,140,255,.25);text-align:center;border:2px solid #fff}
.gatebox .gl{font-size:50px;line-height:1;animation:bob 3.4s ease-in-out infinite}
.gatebox h2{margin:10px 0 4px;font-size:1.45rem;font-weight:900;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.gatebox .gsub{margin:0 0 20px;font-size:.88rem;color:var(--ink2);line-height:1.65}
.gatebox input{width:100%;background:#fdfaff;border:2px solid var(--line2);color:var(--ink);
  border-radius:15px;padding:13px 17px;font-family:inherit;font-size:1rem;font-weight:700;
  outline:none;margin-bottom:10px;text-align:center;transition:.16s}
.gatebox input::placeholder{color:var(--ink3);font-weight:500}
.gatebox input:focus{border-color:var(--lav);box-shadow:0 0 0 4px rgba(169,140,255,.18)}
.gbtn{width:100%;padding:13px;font-size:1rem;margin-top:4px}
.gmsg{min-height:20px;margin-top:10px;font-size:.84rem;font-weight:700;color:#e8558c}
.glink{background:none;border:none;color:var(--ink3);font-family:inherit;font-size:.82rem;
  font-weight:700;cursor:pointer;margin-top:12px;text-decoration:underline;text-underline-offset:3px}
.glink:hover{color:var(--lav)}

.me .meno{background:var(--lav-s);color:var(--lav);font-weight:900;font-size:.78rem;
  padding:4px 11px;border-radius:999px}
.me .mename{font-weight:900;font-size:.9rem;color:var(--ink);padding:0 3px}
.me .mesw{background:var(--pink-s);border:none;color:var(--pink);font-family:inherit;
  font-size:.74rem;font-weight:800;padding:6px 12px;border-radius:999px;cursor:pointer;transition:.16s}
.me .mesw:hover{background:var(--pink);color:#fff}

/* 선생님 표 */
.tscroll{overflow-x:auto;margin-top:6px;border-radius:14px;border:2px solid var(--line)}
table.tt{width:100%;border-collapse:collapse;font-size:.86rem;background:#fff;min-width:520px}
table.tt th{background:linear-gradient(135deg,var(--lav-s),var(--pink-s));color:var(--ink);
  font-weight:900;padding:11px 13px;text-align:left;white-space:nowrap;font-size:.8rem;position:sticky;top:0}
table.tt td{padding:10px 13px;border-top:1px solid var(--line);white-space:nowrap}
table.tt tr:hover td{background:#fdfaff}
table.tt td.num{font-weight:900;color:var(--ink)}
table.tt .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:900;font-size:.76rem}
table.tt .pill.hi{background:var(--mint-s);color:#148a73}
table.tt .pill.mid{background:var(--butter-s);color:#b87400}
table.tt .pill.lo{background:var(--pink-s);color:#d6407a}
table.tt .mini{height:7px;border-radius:99px;background:var(--line);overflow:hidden;min-width:74px}
table.tt .mini>div{height:100%;border-radius:99px;background:var(--grad)}
table.tt td.wrap{white-space:normal;min-width:240px;line-height:1.6}

/* ===================================================================
   질문 탐구 교실 — 추가 컴포넌트
   =================================================================== */
.hero{position:relative;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.lbadge{flex:0 0 auto;background:var(--grad);color:#fff;border-radius:22px;padding:10px 16px;
  text-align:center;box-shadow:0 8px 20px rgba(255,123,169,.35);line-height:1.25}
.lbadge .n{font-size:1.7rem;font-weight:900;display:block}
.lbadge .u{font-size:.72rem;font-weight:800;opacity:.95}

/* 질문 초점 */
.focus{position:relative;background:linear-gradient(135deg,#fff,#fff4f9 60%,#f2ecff);
  border:2px solid #ffd3e3;border-radius:26px;padding:26px 26px 22px;margin:0 0 16px;
  box-shadow:var(--sh);overflow:hidden}
.focus::before{content:'?';position:absolute;right:-6px;top:-38px;font-size:170px;font-weight:900;
  color:rgba(169,140,255,.12);line-height:1}
.focus .fl{font-size:.75rem;font-weight:900;color:var(--pink);letter-spacing:.06em}
.focus .ft{font-size:1.38rem;font-weight:900;line-height:1.55;margin:8px 0 6px;color:var(--ink);position:relative}
.focus .fs{font-size:.86rem;color:var(--ink2);position:relative}
.coreq{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(120deg,var(--mint-s),#f2fffb);
  border:2px solid #a9ecdc;border-radius:20px;padding:15px 18px;margin:12px 0}
.coreq .ic{font-size:1.5rem;line-height:1.2}
.coreq b{color:#128f77}
.goal{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:10px 0}
.goal div{background:#fdfaff;border:2px solid var(--line);border-radius:16px;padding:12px 15px;font-size:.9rem}
.goal div b{color:#7d5fe0}
.goal div b:first-child{display:block;color:var(--lav);font-size:.8rem;margin-bottom:3px}

}

.tdel{border:1.5px solid #ffc4cf;background:#fff4f6;color:#d0344f;font-family:inherit;font-weight:900;font-size:.8rem;border-radius:999px;padding:5px 12px;cursor:pointer}
.tdel:disabled{opacity:.45;cursor:default}
.tact button.del{color:#d0344f;border-color:#ffc4cf}
.rpdel{border:0;background:#ffe9ed;color:#d0344f;border-radius:999px;font-size:.66rem;font-weight:900;padding:0 6px;cursor:pointer;margin-left:4px}
.aibadge.engine{background:linear-gradient(90deg,#1fb48a,#3cc9a0);color:#fff}
.aibadge.device{background:linear-gradient(90deg,#4f7cff,#a46bff);color:#fff}

/* ---------- 📘 개념 학습 흐름 ---------- */
.lguide .lnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.lchip{display:flex;align-items:center;gap:6px;border:2px solid var(--line2);background:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-family:inherit;font-size:.8rem;font-weight:800;color:var(--ink2);cursor:pointer;max-width:100%}
.lchip .ln{width:22px;height:22px;border-radius:50%;background:var(--lav-s);color:var(--lav);display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;flex:0 0 auto}
.lchip .lck{display:none;color:#1fa37a}.lchip.seen .lck{display:inline}
.lchip.on{background:var(--grad);color:#fff;border-color:transparent}.lchip.on .ln{background:rgba(255,255,255,.3);color:#fff}.lchip.on .lck{color:#fff}
.lprog{height:8px;background:var(--lav-s);border-radius:99px;margin-top:10px;overflow:hidden}.lprog>div{height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .4s}
.lsec{display:none}.lsec.on{display:block;animation:lsin .35s ease}
@keyframes lsin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 2px 10px}
.lcount{background:var(--tb-navy,#2f3a8f);color:#fff;border-radius:999px;padding:2px 12px;font-size:.78rem;font-weight:900}

.lsteps{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.lstep{font-size:.72rem;font-weight:800;color:var(--ink3);background:#fff;border:1.5px solid var(--line2);border-radius:999px;padding:2px 9px}
.lstep b{margin-right:3px;color:var(--lav)}
.miniladder{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}

.miniladder .what{background:var(--sky-s);color:#2f93d6}.miniladder .how{background:var(--lav-s);color:#7d5fe0}.miniladder .if{background:var(--pink-s);color:#e8558c}
.miniladder i{font-style:normal;color:var(--ink3);font-weight:900}
.qex{background:#fbf9ff;border:1.5px dashed #d9cff8;border-radius:14px;padding:8px 12px;margin-bottom:8px}

.qexi{margin:6px 0;font-size:.92rem}.qex small{color:var(--ink3)}
.lfoot,.pagenav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 22px}
.pagenav{margin-top:10px;padding-top:12px;border-top:2px dashed var(--line)}
.lfoot .btn,.pagenav .btn{white-space:normal;text-align:left}
.prob.worked{border-color:#c9b8ff}
.btn.main2{background:linear-gradient(90deg,#7d5fe0,#a98cff);color:#fff;border-color:transparent}
.stepbox{display:none;margin-top:10px;background:#fffdf5;border:1.5px solid #f3e3b5;border-radius:14px;padding:6px 12px}
.stepbox.on{display:block}
.stp{display:none;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed #f0e2bb;line-height:1.9}

.roadmap .road{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.roadmap .road button{border:2px solid var(--line2);background:#fff;border-radius:16px;padding:8px 10px;font-family:inherit;text-align:left;cursor:pointer;font-weight:900;font-size:.88rem;color:var(--ink);display:flex;flex-direction:column;gap:2px;transition:.15s}
.roadmap .road button:hover{border-color:var(--lav);transform:translateY(-2px)}

@media (max-width:720px){ .roadmap .road{grid-template-columns:1fr 1fr} .lsteps{margin-left:0} }

/* ---------- 🎬 동기 유발 영상 ---------- */
.ytgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;align-items:flex-start}
.ytgrid > .ytbox{flex:1 1 300px;max-width:680px}
.ytgrid > .ytbox.short{flex:0 1 290px;max-width:290px}
.ytbox{background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 20px rgba(125,95,224,.12)}

.ytbox.short .ytplay,.ytbox.short iframe{aspect-ratio:9/16;max-height:560px}
.ytplay img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.ytplay:hover img{transform:scale(1.04)}
.ytbtn{position:absolute;left:50%;top:50%;width:72px;height:50px;margin:-25px 0 0 -36px;border-radius:14px;background:#ff0033;box-shadow:0 8px 20px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;animation:ytpulse 1.8s ease-in-out infinite}
.ytbtn i{width:0;height:0;border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:4px}
@keyframes ytpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ytshort{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.65);color:#fff;font-size:.7rem;font-weight:900;border-radius:999px;padding:2px 9px}
.ytmeta{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.ytmeta b{font-size:.95rem}.ytmeta span{font-size:.78rem;color:var(--ink3);font-weight:700}.ytmeta a{font-size:.76rem;font-weight:800;color:#d0344f;text-decoration:none}

/* ---------- 🎞️ 모션 그래픽 ---------- */
.mg{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#fff0f6,#eef3ff)}
.mg video{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.mg video.ready{opacity:1}
.mg.fail{display:none}
.mg.ld::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%) -150% 0/60% 100% no-repeat;animation:mgshim 1.3s linear infinite}
@keyframes mgshim{to{background-position:250% 0}}
.mg.concept{aspect-ratio:16/9;max-height:340px;margin:0 auto 14px;box-shadow:0 14px 30px rgba(125,95,224,.20);border:3px solid #fff;outline:2px solid rgba(155,123,255,.25)}
.mg.concept.on{animation:mgglow 3.2s ease-in-out infinite}
@keyframes mgglow{0%,100%{box-shadow:0 14px 30px rgba(125,95,224,.20)}50%{box-shadow:0 16px 38px rgba(255,107,157,.32)}}
.mg .mgcap{position:absolute;left:10px;bottom:8px;z-index:2;background:rgba(255,255,255,.9);border-radius:999px;padding:3px 11px;font-size:.68rem;font-weight:900;color:#5a3fc0;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.mg.concept.on .mgcap::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4d7e;margin-right:6px;vertical-align:1px;animation:recdot 1.2s ease-in-out infinite}
@keyframes recdot{50%{opacity:.25}}
.card > h2 .mg.mini{margin-left:auto;flex:0 0 auto;width:96px;height:54px;border-radius:12px;border:2px solid rgba(255,255,255,.8);box-shadow:0 4px 12px rgba(125,95,224,.25);transition:transform .25s}
.card > h2 .mg.mini:hover{transform:scale(1.6) translateX(-12px);z-index:5}
.card > h2:has(.mg.mini){display:flex;align-items:center;gap:8px}
/* 자동 재생이 막혔을 때 : 눌러서 움직이기 */
.mgtap{display:none;position:absolute;inset:0;z-index:3;border:0;margin:0;padding:0;cursor:pointer;font-family:inherit;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.25),rgba(40,20,90,.35));color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.mgtap i{font-style:normal;width:58px;height:58px;border-radius:50%;background:var(--grad,linear-gradient(135deg,#ff7ba9,#9b7bff));display:flex;align-items:center;justify-content:center;font-size:1.4rem;padding-left:4px;box-shadow:0 8px 20px rgba(0,0,0,.3);animation:ytpulse 1.6s ease-in-out infinite}
.mgtap span{font-weight:900;font-size:.82rem;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.mg.tap .mgtap,.stage.tap .mgtap{display:flex}
.mg.mini .mgtap i{width:26px;height:26px;font-size:.7rem;animation:none}.mg.mini .mgtap span{display:none}
.mgdead .mgtap,.mgdead .herotag{display:none!important}
.motion-off .mg .mgtap,.motion-off .stage .mgtap{display:flex;background:rgba(40,20,90,.18)}
.motion-off .mg .mgtap span,.motion-off .stage .mgtap span{display:none}
.motion-off .mg .mgtap i,.motion-off .stage .mgtap i{width:44px;height:44px;font-size:1rem;opacity:.85;animation:none}
.motion-off .mg.mini .mgtap i{width:24px;height:24px;font-size:.65rem}
.motion-off .mg video.ready{opacity:1}
/* 표지 */
.scene .stage .herov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s;z-index:0}
.scene .stage .herov.ready{opacity:1}
.scene .stage .glare,.scene .stage .cap{z-index:2}
.scene .stage .herotag{position:absolute;right:16px;top:14px;z-index:2;background:rgba(20,16,60,.55);backdrop-filter:blur(4px);color:#fff;font-size:.72rem;font-weight:900;border-radius:999px;padding:4px 12px;opacity:0;transition:opacity .6s}
.scene .stage.on .herotag{opacity:1}
.scene .stage > img{animation:kenburns 16s ease-in-out infinite alternate;transform-origin:60% 40%}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08) translate(-1%,1%)}}
.scene .stage.on > img{animation:none}
/* 머리말 단추 · 점수 튀기 */
.mvbtn.off{background:#f2f0f7;filter:grayscale(.6)}
.score .sc.bump{animation:scbump .6s cubic-bezier(.2,.9,.25,1.5)}
.score .sc.bump .v{color:#ff4d7e;transition:color .6s}

/* 카드가 차례로 떠오르기 */
.rv{opacity:0;transform:translateY(18px) scale(.985)}
.rv.in{opacity:1;transform:none;transition:opacity .55s ease var(--d,0ms),transform .55s cubic-bezier(.2,.9,.25,1.15) var(--d,0ms)}
.lsec .card > h2 .chip{animation:chipin .6s cubic-bezier(.2,.9,.25,1.3) both}

.prob,.qexi,.ytbox{transition:transform .2s,box-shadow .2s}
.prob:hover,.qexi:hover,.ytbox:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(125,95,224,.16)}

/* 🎞️ 단추로 움직임을 끈 경우에만 화면 움직임을 멈춤 (윈도우 설정과 상관없이 기본은 켜짐) */

.tclsbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px;padding:10px 12px;background:linear-gradient(135deg,#f4f0ff,#fff3f8);border:2px solid var(--line);border-radius:16px}

.twh{display:flex;align-items:center;gap:6px;font-weight:900;font-size:.88rem}.twh small{margin-left:auto;font-size:.7rem;color:var(--ink3);font-weight:700}
.twans{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.8rem;font-weight:800;border-radius:10px;padding:5px 8px}
.twans.ok{background:#e9f8f1;color:#13805c}.twans.no{background:#fff0f3;color:#c0304a}
.twans span{background:#fff;border-radius:7px;padding:0 6px;border:1px solid currentColor}.twans span.ok{color:#13805c}.twans span.no{color:#c0304a}
.twans small{margin-left:auto;font-weight:700;opacity:.8}
.twnote{font-size:.78rem;line-height:1.5;color:var(--ink2);background:#fbf9ff;border-radius:10px;padding:6px 8px;max-height:9em;overflow:hidden;white-space:pre-wrap}
.twink,.twgr{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.twf{font-size:.74rem;font-family:'Consolas',monospace;display:flex;flex-wrap:wrap;gap:4px 10px}.twf i{font-style:normal;font-weight:700}
.twf.big{font-size:.9rem;margin:4px 0}
.twmodal{position:fixed;inset:0;z-index:980;background:rgba(28,22,60,.7);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto}
.twmodal[hidden]{display:none}
.twbox{width:min(1080px,100%);background:#fffdf8;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.twtop{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:#fff;border-bottom:2px solid #f0eafd}
.twtop .btn{padding:6px 12px;font-size:.82rem}.twtop .btn:disabled{opacity:.35}
.twbody{padding:6px 18px 22px}
.twbody h3{margin:18px 0 8px;font-size:1.05rem;color:#5a3fc0}
.twbody section{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 12px;background:#fff}
.twbody h4{margin:0 0 8px;font-size:.95rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.twbody h4 small{font-weight:700;color:var(--ink3)}
.twq{font-size:.88rem;color:var(--ink2);background:#fbf9ff;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.twl{font-size:.78rem;font-weight:900;color:#5a3fc0;margin:10px 0 4px}
.twgbig{display:block;width:100%;max-width:720px;height:auto;border:2px solid #c9b8ff;border-radius:12px}
.cornell.ro .rot{padding:6px 12px 10px;white-space:pre-wrap;font-size:.92rem;line-height:1.7;min-height:2.4em}
.pad.ro canvas{cursor:default}
.twnone{font-size:.82rem;color:var(--ink3);margin:0}

/* ===================================================================
   교과서 스타일 + 입체감 + 큰 글씨 · 큰 수식
   =================================================================== */
:root{
  --tb-navy:#3c4aa6; --tb-navy2:#2f3a8c; --tb-green:#2f6e3d; --tb-green2:#4d9a5c;
  --tb-purple:#7b5cc4; --tb-purple-s:#efe8ff; --tb-orange:#f07a3e; --tb-yellow:#ffd22e;
  --paper:#fffdf8;
  --sh3d:0 1px 0 #fff inset, 0 2px 0 rgba(60,74,166,.06), 0 10px 24px -6px rgba(60,74,166,.22), 0 26px 50px -24px rgba(60,74,166,.30);
}
html{font-size:17.5px}
body{
  font-size:1.06rem; line-height:1.9;
  background:
    linear-gradient(rgba(60,74,166,.045) 1px, transparent 1px) 0 0/26px 26px,
    linear-gradient(90deg, rgba(60,74,166,.045) 1px, transparent 1px) 0 0/26px 26px,
    radial-gradient(900px 500px at 8% -6%, #ffe9f2 0%, transparent 62%),
    radial-gradient(800px 480px at 96% 0%, #e7ecff 0%, transparent 60%),
    var(--paper);
  background-attachment:fixed;
}
.wrap{max-width:1100px}

/* ---------- 교과서 상단 띠 (단원 경로 + 쪽수) ---------- */
.crumb{position:sticky;top:0;z-index:45;background:linear-gradient(90deg,var(--tb-navy2),var(--tb-navy));color:#fff;
  font-size:.8rem;font-weight:800;box-shadow:0 3px 10px rgba(47,58,140,.3)}
.crumb .wrap{display:flex;align-items:center;gap:10px;padding:7px 18px}
.crumb .cb{opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .cb b{color:var(--tb-yellow)}
.crumb .pgpill{margin-left:auto;background:#fff;color:var(--tb-navy);border-radius:999px;padding:2px 14px;font-weight:900;white-space:nowrap}
nav.tabs{top:38px}

/* ---------- 머리 제목 : 교과서 소단원 번호 ---------- */
.hd h1{font-size:1.75rem}
.hd h1 small{font-size:.78rem}
.logo{display:none}
.secno{position:relative;flex:0 0 auto;width:74px;height:74px;display:flex;align-items:center;justify-content:center;
  font-size:2.3rem;font-weight:900;color:var(--tb-navy2);font-family:'Pretendard',sans-serif;letter-spacing:-.04em}
.secno::before{content:'';position:absolute;inset:6px;border-radius:50%;border:8px solid var(--tb-yellow);
  box-shadow:0 6px 14px rgba(255,190,0,.35), inset 0 2px 4px rgba(0,0,0,.08)}
.secno span{position:relative;transform:translateX(12px)}

/* ---------- 탭 : 눌리는 입체 버튼 ---------- */
.tab{font-size:.95rem;padding:10px 17px;border-bottom-width:4px;border-color:#e2dbee}
.tab.on{background:linear-gradient(180deg,#8f73e0,var(--tb-purple));border-bottom:4px solid #5b3fa3;box-shadow:0 8px 18px rgba(123,92,196,.38)}
.tab:active{transform:translateY(2px)}

/* ---------- 카드 : 교과서 녹색 머리띠 + 입체 ---------- */
.card{border-radius:24px;padding:0 26px 22px;box-shadow:var(--sh3d);border:1px solid #ece6f6;overflow:hidden;
  transition:transform .35s cubic-bezier(.2,.9,.2,1), box-shadow .35s}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 0 #fff inset, 0 16px 34px -8px rgba(60,74,166,.28), 0 34px 60px -28px rgba(60,74,166,.36)}
.card > h2:first-child{position:relative;margin:0 -26px 16px;padding:12px 70px 12px 22px;font-size:1.18rem;color:#fff;min-height:52px;
  background:linear-gradient(100deg,var(--tb-green) 0%,var(--tb-green2) 100%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.card > h2:first-child::after{content:'';position:absolute;right:0;top:0;bottom:0;width:58px;
  background:linear-gradient(115deg,transparent 0 38%,rgba(255,255,255,.22) 38% 56%,transparent 56% 64%,rgba(255,255,255,.14) 64% 80%,transparent 80%)}
.card > h2:first-child .chip{background:#fff;color:var(--tb-green);box-shadow:none;font-size:.76rem}
.card > h2:first-child .btn{margin-left:auto}
.card h2{font-size:1.18rem}
.lead{font-size:1.02rem}
.box b,.goal div b:first-child{font-size:.9rem}

/* 질문 초점 : 3D 칠판 카드 */
.focus{border:none;border-radius:28px;padding:30px 30px 26px;
  background:linear-gradient(150deg,#ffffff 0%,#fff3f8 55%,#f0eaff 100%);
  box-shadow:0 2px 0 #fff inset, 0 20px 40px -14px rgba(123,92,196,.35), 0 3px 0 #e9defc}
.focus .fl{font-size:.82rem}
.focus .ft{font-size:1.75rem;line-height:1.5}
.focus .fs{font-size:.98rem}

/* ---------- 3D 장면 (입체 그림) ---------- */
.scene{perspective:1100px;margin:0 0 18px}
.scene .stage{position:relative;border-radius:28px;overflow:hidden;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;
  box-shadow:0 30px 60px -22px rgba(47,58,140,.45), 0 12px 24px -10px rgba(123,92,196,.35)}
.scene img{display:block;width:100%;aspect-ratio:21/9;max-height:440px;object-fit:cover;background:linear-gradient(135deg,#ffe3ed,#e3e8ff)}
.scene .glare{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(600px 300px at var(--gx,30%) var(--gy,20%), rgba(255,255,255,.35), transparent 60%)}
.scene .cap{position:absolute;left:22px;bottom:20px;right:22px;transform:translateZ(60px);display:flex;align-items:flex-end;gap:14px}
.scene .cap .tt{background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:20px;padding:12px 20px;
  box-shadow:0 12px 30px rgba(47,58,140,.3);max-width:640px}
.scene .cap .tt b{display:block;font-size:1.45rem;color:var(--tb-navy2);line-height:1.3}
.scene .cap .tt span{font-size:.9rem;color:var(--ink2);font-weight:700}
.scene .badge3d{transform:translateZ(90px);background:var(--tb-yellow);color:var(--tb-navy2);font-weight:900;border-radius:18px;
  padding:8px 16px;box-shadow:0 10px 0 #e0b400, 0 18px 26px rgba(0,0,0,.25);font-size:1.05rem;white-space:nowrap}
@media (max-width:640px){ .scene .cap .tt b{font-size:1.1rem} .scene .badge3d{display:none} }

/* 카드 속 사진 · 그림 */
.ph{position:relative;margin:4px 0 16px;border-radius:20px;overflow:hidden;box-shadow:0 18px 34px -16px rgba(47,58,140,.45);
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}
.ph img{display:block;width:100%;max-height:360px;object-fit:cover;background:linear-gradient(135deg,#ffe3ed,#e3e8ff);aspect-ratio:4/3}
.ph figcaption{position:absolute;right:10px;bottom:8px;background:rgba(0,0,0,.45);color:#fff;font-size:.68rem;border-radius:999px;padding:2px 10px}
.ph.side{float:right;width:min(42%,380px);margin:0 0 12px 18px}
@media (max-width:700px){ .ph.side{float:none;width:100%;margin:4px 0 14px} }
.clearfix::after{content:'';display:block;clear:both}

/* 책 : 실물 책처럼 */
.bookwrap{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:22px;align-items:start}
@media (max-width:760px){ .bookwrap{grid-template-columns:1fr} }
.bookcover{perspective:900px}
.bookcover .bk{position:relative;transform:rotateY(-18deg) rotateX(4deg);transform-style:preserve-3d;transition:transform .5s;
  border-radius:6px 14px 14px 6px;overflow:visible}
.bookcover .bk:hover{transform:rotateY(-4deg) rotateX(0)}
.bookcover .bk img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px 12px 12px 4px;
  box-shadow:inset 6px 0 10px rgba(0,0,0,.25), 18px 22px 30px -10px rgba(40,30,10,.55), 4px 4px 0 #e8dcc0, 7px 7px 0 #d9c9a3}
.bookcover .bk::before{content:'';position:absolute;left:0;top:0;bottom:0;width:14px;border-radius:4px 0 0 4px;
  background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.15),rgba(0,0,0,.1));z-index:2}
.bookcover .bnote{font-size:.72rem;color:#9c8558;margin-top:12px;line-height:1.5;text-align:center}
.book{padding:24px 28px}
.book .pg{font-size:1.12rem;line-height:2.1}
.book h3{font-size:1.2rem}

/* ---------- 문제 카드 : 교과서 「문제」「예제」 ---------- */
.prob{border-radius:24px;box-shadow:var(--sh3d);border:1px solid #ece6f6;padding:22px 26px}
.ptag{background:var(--tb-purple-s);color:var(--tb-purple);font-size:.82rem;padding:5px 14px}
.prob.ex{background:linear-gradient(180deg,#fffdf4,#fff);border:2px solid #f3e4b4}
.prob.ex .ptag{background:linear-gradient(135deg,#7b5cc4,#9a7ce6);color:#fff;font-size:.9rem;padding:6px 16px 6px 14px;border-radius:10px 22px 22px 10px;
  box-shadow:0 4px 0 #5b3fa3}
.prob.ex .exbar{font-size:.8rem;font-weight:900;color:#b0862a;margin:-4px 0 8px}
.q{font-size:1.1rem;line-height:2}
.fld>.lb{font-size:.95rem}
.fld input[type=text]{font-size:1.05rem;max-width:320px}
.opt{font-size:1rem;padding:10px 18px}
.btn{font-size:.95rem;border-bottom-width:4px}
.btn.main{border-bottom:4px solid #d0457f}
.btn:active{transform:translateY(2px)}
.hintbox,.solbox,.keybox{font-size:1.02rem}
.verdict{font-size:1rem}

/* ---------- 수식 크게 ---------- */
.katex{font-size:1.22em}
.q .katex{font-size:1.2em}
.eq{font-size:1.06rem;padding:18px 22px}
.eq .katex{font-size:1.36em}
.opt .katex{font-size:1.14em}
.fld .lb .katex{font-size:1.14em}
.katex-display>.katex{font-size:1.3em}
.box .katex,.goal .katex{font-size:1.16em}
.lab .out{font-size:1rem}
.lab .out .katex{font-size:1.18em}
.solbox .katex,.hintbox .katex{font-size:1.18em}

/* 질문 상자 · 목록 글씨 */
.composer textarea{font-size:1.02rem}
.qchip{font-size:.86rem}
.qi .qtx{font-size:1.04rem}
.talk .tq{font-size:1.02rem}
.talk textarea,.inp{font-size:1rem}
.motion .mt{font-size:1.25rem}

/* 점수판 입체 */
.sc{box-shadow:var(--sh3d);border:1px solid #fff}
.sc .v{font-size:1.6rem}

/* 차시 목록 카드 이미지 */
.lcard .lthumb{flex:0 0 120px;height:120px;border-radius:18px;overflow:hidden;box-shadow:0 12px 20px -10px rgba(47,58,140,.5)}
.lcard .lthumb{position:relative}
.lcard .lthumb img{width:100%;height:100%;object-fit:cover}
.lcard .lthumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.lcard .lthumb video.ready{opacity:1}
.lcard:hover .lthumb video{transform:scale(1.06);transition:opacity .8s,transform .4s}
@keyframes lcin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  html{font-size:16.5px}
  .focus .ft{font-size:1.32rem}
  .hd h1{font-size:1.3rem}
  .card{padding:0 16px 18px} .card > h2:first-child{margin:0 -16px 14px;padding:11px 16px}
  .prob{padding:18px 16px}
  nav.tabs{top:34px}
}

.grphead{display:flex;align-items:center;gap:12px;margin:26px 0 14px;font-weight:900;font-size:1.12rem}
.grphead span{background:linear-gradient(90deg,var(--tb-navy2),var(--tb-navy));color:#fff;padding:8px 26px 8px 18px;
  border-radius:12px 30px 30px 12px;box-shadow:0 5px 0 #222b6e,0 12px 20px -8px rgba(47,58,140,.5)}
.grphead::after{content:'';flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--tb-navy),transparent)}

.lcard .lno{width:58px;height:58px;flex:none}
.lcard > div:first-child{flex:0 0 120px}

/* ---------- 탭 막대 : 넓은 화면은 줄바꿈, 좁은 화면은 화살표 + 끌어서 넘기기 ---------- */
nav.tabs{position:sticky}
.tabs-in{scroll-behavior:smooth;cursor:grab;user-select:none;-webkit-user-select:none}
.tabs-in.dragging{cursor:grabbing;scroll-behavior:auto}
.tabs-in.dragging .tab{pointer-events:none}
@media (min-width:600px){
  .tabs-in{flex-wrap:wrap;justify-content:center;overflow:visible;cursor:default}
  .tabarr{display:none !important}
}
.tabarr{position:absolute;top:0;bottom:0;width:46px;border:0;z-index:2;font-size:1.25rem;font-weight:900;color:var(--lav);
  cursor:pointer;display:flex;align-items:center;font-family:inherit;transition:opacity .2s}
.tabarr.l{left:0;justify-content:flex-start;padding-left:6px;background:linear-gradient(90deg,rgba(255,250,252,1) 45%,rgba(255,250,252,0))}
.tabarr.r{right:0;justify-content:flex-end;padding-right:6px;background:linear-gradient(270deg,rgba(255,250,252,1) 45%,rgba(255,250,252,0))}
.tabarr span{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--lav-s);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(125,95,224,.18)}
.tabarr.hide{opacity:0;pointer-events:none}
.hscroll-grab{cursor:grab}
.hscroll-grab.dragging{cursor:grabbing;user-select:none}

/* ---------- 성우 낭독 ---------- */
.narr{display:flex;gap:14px;align-items:center;margin:10px 0 14px;padding:12px 14px;border-radius:18px;
  background:linear-gradient(135deg,#fff4f9,#f3efff);border:2px solid #f1dcff;box-shadow:0 6px 16px rgba(169,140,255,.14)}
.nbtn{flex:0 0 auto;display:flex;align-items:center;gap:9px;border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:.95rem;
  color:#fff;background:var(--grad);padding:11px 18px 11px 12px;border-radius:999px;box-shadow:0 5px 0 #d9568a,0 10px 18px rgba(255,123,169,.35);transition:.15s}
.nbtn:hover{transform:translateY(-2px)}
.nbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #d9568a,0 4px 8px rgba(255,123,169,.3)}
.nbtn .ni{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:.8rem;letter-spacing:-1px}
.narr.play .nbtn{background:linear-gradient(135deg,#7d5fe0,#a98cff);box-shadow:0 5px 0 #5c40bd,0 10px 18px rgba(125,95,224,.35)}
.narr.play .ni{animation:npulse 1.2s ease-in-out infinite}
@keyframes npulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}50%{box-shadow:0 0 0 7px rgba(255,255,255,0)}}
.ninfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ninfo b{font-size:.9rem;color:var(--ink)}
.ninfo>span{font-size:.8rem;color:var(--ink2)}
.nbar{height:8px;border-radius:99px;background:#fff;border:1px solid #eadcff;overflow:hidden;cursor:pointer;margin-top:4px}
.nfill{height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .25s linear}
.nmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ntime{font-size:.74rem;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
.nspd{display:flex;gap:4px}
.nspd button{border:1.5px solid #e4d8ff;background:#fff;color:#7d5fe0;font-family:inherit;font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:999px;cursor:pointer}
.nspd button.on{background:#7d5fe0;color:#fff;border-color:#7d5fe0}
.nai{font-size:.68rem;color:var(--ink3)}
.book.reading{box-shadow:0 0 0 3px rgba(169,140,255,.45),0 14px 30px rgba(125,95,224,.18);transition:box-shadow .4s}
@media (max-width:560px){ .narr{flex-direction:column;align-items:stretch} .nbtn{justify-content:center} }
.seg{flex-wrap:wrap;max-width:100%}

</style>
</head>

</div>

<script>
/* ===================================================================
   질문 탐구 교실 — 공통 도구 (KaTeX · 채점 · 문제 카드 · 그래프)
   =================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tex(root){
  if (!window.renderMathInElement) return;
  try{
    renderMathInElement(root || document.body, {
      delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],
      throwOnError:false, strict:false,
      ignoredTags:['script','noscript','style','textarea','option','input']
    });
  }catch(e){}
}
function snack(msg, ms){
  const s = $('#snack'); if (!s) return;
  s.textContent = msg; s.classList.add('on');
  clearTimeout(snack._h); snack._h = setTimeout(() => s.classList.remove('on'), ms || 2200);
}
function ago(t){
  const d = (Date.now() - new Date(t).getTime()) / 1000;
  if (d < 60) return '방금';
  if (d < 3600) return Math.floor(d/60) + '분 전';
  if (d < 86400) return Math.floor(d/3600) + '시간 전';
  return new Date(t).toLocaleDateString('ko-KR', {month:'numeric', day:'numeric'});
}

/* ---------- 답안 정규화 ---------- */
function normNum(s){
  if (s == null) return NaN;
  s = String(s).replace(/\s/g,'').replace(/[−–—]/g,'-').replace(/[()]/g,'');
  if (s === '') return NaN;
  const f = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (f) return parseFloat(f[1]) / parseFloat(f[2]);
  const v = parseFloat(s);
  return (isNaN(v) || !/^-?\d*\.?\d+$/.test(s)) ? NaN : v;
}
function normTxt(s){
  return String(s||'').toLowerCase().replace(/\s/g,'').replace(/[−–—]/g,'-')
    .replace(/[{}［］\[\]（）()]/g,'').replace(/[.,]$/,'').replace(/×/g,'*');
}
function normSet(s){
  let t = String(s||'').replace(/\s/g,'').replace(/[−–—]/g,'-')
          .replace(/[{}［］\[\]（）()]/g,'').replace(/^,|,$/g,'');
  if (t === '') return '∅';
  const parts = [...new Set(t.split(/[,、/]+/).filter(Boolean))];
  const allNum = parts.every(x => /^-?\d+(\.\d+)?$/.test(x));
  parts.sort(allNum ? (a,b)=>parseFloat(a)-parseFloat(b) : undefined);
  return parts.join(',');
}
function checkField(f, val){
  if (f.t === 'sel')   return val === f.a;
  if (f.t === 'multi') return normSet((val||[]).join(',')) === normSet(f.a.join(','));
  if (f.t === 'num'){ const n = normNum(val); return !isNaN(n) && Math.abs(n - f.a) < 1e-9; }
  if (f.t === 'set')   return normSet(val) === normSet(f.a.join(','));
  if (f.t === 'txt')   return f.a.some(a => normTxt(a) === normTxt(val));
  return false;
}

/* ===================================================================
   📈 작은 그래프 엔진 (캔버스)
   =================================================================== */
function makePlot(host, o){
  o = Object.assign({ w:440, h:340, xr:[-6,6], yr:[-6,6], grid:true, labels:true }, o || {});
  host.innerHTML = '';
  const W = Math.min(o.w, (host.clientWidth || o.w)), H = Math.round(W * o.h / o.w);
  const cv = document.createElement('canvas');
  const dpr = window.devicePixelRatio || 1;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  host.appendChild(cv);
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  const P = {
    cv, c, W, H, o,
    X: x => (x - o.xr[0]) / (o.xr[1] - o.xr[0]) * W,
    Y: y => H - (y - o.yr[0]) / (o.yr[1] - o.yr[0]) * H,
    clear(){
      c.fillStyle = '#fff'; c.fillRect(0,0,W,H);
      if (o.grid){
        c.strokeStyle = '#f1ecf7'; c.lineWidth = 1;
        for (let x = Math.ceil(o.xr[0]); x <= o.xr[1]; x++){ c.beginPath(); c.moveTo(P.X(x),0); c.lineTo(P.X(x),H); c.stroke(); }
        for (let y = Math.ceil(o.yr[0]); y <= o.yr[1]; y++){ c.beginPath(); c.moveTo(0,P.Y(y)); c.lineTo(W,P.Y(y)); c.stroke(); }
      }
      c.strokeStyle = '#4a3f5c'; c.lineWidth = 1.4;
      c.beginPath(); c.moveTo(0,P.Y(0)); c.lineTo(W,P.Y(0)); c.stroke();
      c.beginPath(); c.moveTo(P.X(0),0); c.lineTo(P.X(0),H); c.stroke();
      if (o.labels){
        c.fillStyle = '#8a7fa3'; c.font = '11px system-ui'; c.textAlign = 'center';
        const st = Math.max(1, Math.round((o.xr[1]-o.xr[0]) / 12));
        for (let x = Math.ceil(o.xr[0]); x <= o.xr[1]; x += 1) if (x && x % st === 0) c.fillText(x, P.X(x), P.Y(0) + 13);
        c.textAlign = 'right';
        for (let y = Math.ceil(o.yr[0]); y <= o.yr[1]; y += 1) if (y && y % st === 0) c.fillText(y, P.X(0) - 4, P.Y(y) + 4);
        c.textAlign = 'left'; c.font = 'italic 12px Georgia,serif'; c.fillStyle = '#4a3f5c';
        c.fillText('x', W - 12, P.Y(0) - 6); c.fillText('y', P.X(0) + 6, 12); c.fillText('O', P.X(0) + 3, P.Y(0) + 13);
      }
    },
    fn(f, col, op){
      op = op || {};
      const a = op.dom ? op.dom[0] : o.xr[0], b = op.dom ? op.dom[1] : o.xr[1];
      c.strokeStyle = col || '#ff7ba9'; c.lineWidth = op.lw || 2.6; c.setLineDash(op.dash || []);
      c.beginPath(); let pen = false, py = null;
      const N = op.n || 900;
      for (let i = 0; i <= N; i++){
        const x = a + (b - a) * i / N;
        let y; try{ y = f(x); }catch(e){ y = NaN; }
        if (!isFinite(y) || Math.abs(y) > 1e4){ pen = false; py = null; continue; }
        const sx = P.X(x), sy = P.Y(y);
        if (pen && py != null && Math.abs(sy - py) > H * 1.2){ pen = false; }
        if (!pen){ c.moveTo(sx, sy); pen = true; } else c.lineTo(sx, sy);
        py = sy;
      }
      c.stroke(); c.setLineDash([]);
    },
    line(x1,y1,x2,y2,col,dash,lw){
      c.strokeStyle = col || '#b4abc6'; c.lineWidth = lw || 1.6; c.setLineDash(dash || [6,5]);
      c.beginPath(); c.moveTo(P.X(x1),P.Y(y1)); c.lineTo(P.X(x2),P.Y(y2)); c.stroke(); c.setLineDash([]);
    },
    dot(x,y,col,label,open){
      c.beginPath(); c.arc(P.X(x),P.Y(y),4.6,0,7);
      if (open){ c.fillStyle = '#fff'; c.fill(); c.strokeStyle = col || '#7d5fe0'; c.lineWidth = 2; c.stroke(); }
      else { c.fillStyle = col || '#7d5fe0'; c.fill(); }
      if (label){ c.fillStyle = col || '#7d5fe0'; c.font = 'bold 12px system-ui'; c.textAlign = 'left'; c.fillText(label, P.X(x)+7, P.Y(y)-7); }
    },
    text(x,y,t,col,font){ c.fillStyle = col || '#4a3f5c'; c.font = font || 'bold 12px system-ui'; c.textAlign='left'; c.fillText(t, P.X(x), P.Y(y)); }
  };
  P.clear();
  return P;
}

  }

function makeCard(p, opt){
  opt = opt || {};
  const el = document.createElement('div');
  const asEx = opt.mode === 'example';
  const solHTML = (window.LESSON_SOL && LESSON_SOL[p.id]) || p.sol || '';
  const steps = solHTML.split(/<br\s*\/?>/).map(x => x.trim()).filter(Boolean);
  el.className = 'prob' + (p.ex || asEx ? ' ex' : '') + (asEx ? ' worked' : ''); el.id = 'p-' + p.id;
  el.innerHTML =
    `<div class="ptop"><span class="ptag">${p.tag}</span><span class="lvl ${p.lv}">${p.lv}</span>
       <span class="pts">+${p.pt}점</span></div>
     ${asEx ? `<div class="exbar">📘 ${p.ex ? '교과서 예제' : '예제'} — 먼저 30초만 스스로 생각해 보고, 「👣 풀이 따라가기」로 한 단계씩 확인해요. 그다음 답 칸에 직접 써 보세요!</div>`
       : p.ex ? '<div class="exbar">📘 교과서 예제 — 먼저 스스로 풀고, 「풀이 보기」로 교과서 풀이와 비교해 보세요</div>' : ''}
     <div class="q">${p.q}</div>
     ${p.fig ? `<div class="lab figbox" data-fig="${p.fig}"></div>` : ''}
     ${window.wkProbHTML ? wkProbHTML(p) : ''}
     <div class="fields">` +
       p.fs.map((f,i) => `<div class="fld" data-f="${i}"><div class="lb">${f.l}</div>${fieldHTML(f,i)}</div>`).join('') +
    `</div>
     <div class="pbtns">
       <button class="btn main act-chk">정답 확인</button>
       <button class="btn hint act-hint">💡 힌트</button>
       ${asEx ? '<button class="btn main2 act-step">👣 풀이 따라가기</button>' : '<button class="btn act-sol">📖 풀이 보기</button>'}
       <button class="askbtn act-ask">❓ 이 문제에 질문하기</button>
     </div>
     <div class="verdict"></div><div class="hintbox"></div><div class="keybox"></div>
     ${asEx ? `<div class="stepbox">${steps.map((x, i) => `<div class="stp" data-i="${i}"><span class="sn">${i + 1}</span><div>${x}</div></div>`).join('')}</div>` : ''}
     <div class="solbox"><div class="st">📖 풀이</div>${solHTML}</div>
     <div class="askhost"></div>`;

  ST[p.id] = { solved:false, tries:0, hints:0, got:p.fs.map(f => f.t === 'multi' ? [] : null) };
  const s = ST[p.id];
  const vd = $('.verdict', el), hb = $('.hintbox', el), sb = $('.solbox', el), kb = $('.keybox', el);

  function showKey(){
    if (!p.key || kb.classList.contains('on')) return;
    kb.innerHTML = `<div class="kt">✨ 이 문제의 핵심</div>${p.key}`;
    kb.classList.add('on'); tex(kb);
  }
  $$('.opt', el).forEach(b => b.onclick = () => {
    const i = +b.dataset.i, f = p.fs[i], v = f.opts[+b.dataset.v];
    SND.tap();
    if (f.t === 'multi'){
      const arr = s.got[i] || []; const k = arr.indexOf(v);
      if (k >= 0) arr.splice(k,1); else arr.push(v);
      s.got[i] = arr; b.classList.toggle('sel', arr.includes(v));
    } else {
      s.got[i] = v; $$(`.opt[data-i="${i}"]`, el).forEach(o => o.classList.toggle('sel', o === b));
    }
  });
  $$('input[type=text]', el).forEach(inp => {
    inp.oninput = () => { s.got[+inp.dataset.i] = inp.value; };
    inp.onkeydown = e => { if (e.key === 'Enter') grade(); };
  });
  const HN = (p.hints || []).length;
  function showHint(auto){
    const before = s.hints;
    if (s.hints < HN) s.hints++;
    hb.classList.add('on');
    if (s.hints !== before) SND.hint();
    const left = HN - s.hints;
    hb.innerHTML = (auto ? `<div class="hstep" style="font-weight:900;color:#d98c00">괜찮아요! 힌트를 하나 열어 둘게요 👇</div>` : '') +
      p.hints.slice(0, s.hints).map((h,i) => `<div class="hstep"><span class="hn">힌트 ${i+1}</span>${h}</div>`).join('') +
      (left > 0 ? `<div class="hstep" style="color:#a08a52">💡 힌트가 <b>${left}개</b> 더 있어요. 먼저 스스로 한 번 더!</div>`
                : `<div class="hstep" style="color:#a08a52">힌트를 모두 열었어요. 그래도 막히면 <b>❓ 이 문제에 질문하기</b>로 친구들에게 물어보세요!</div>`);
    tex(hb);
    if (left === 0) showKey();
  }
  function grade(){
    s.tries++;
    let ok = 0;
    p.fs.forEach((f,i) => {
      const good = checkField(f, s.got[i]);
      const fe = $(`.fld[data-f="${i}"]`, el);
      fe.classList.toggle('ok', good); fe.classList.toggle('no', !good);
      if (good) ok++;
    });
    const all = ok === p.fs.length;
    if (window.wkAnswer) wkAnswer(p, s.got, all, s.tries);
    if (all && !s.solved){
      s.solved = true; PTS += p.pt; STREAK++;
      el.classList.add('solved'); celebrate(p.pt, STREAK); showKey();
      if (window.logAttempt) logAttempt(p.id, true, s.tries, s.hints);
      if (window.paintScore) paintScore();
    } else if (!all){ STREAK = 0; SND.wrong(); if (window.logAttempt) logAttempt(p.id, false, s.tries, s.hints); }
    vd.className = 'verdict ' + (all ? 'ok' : 'no');
    vd.innerHTML = all
      ? `🎉 정답이에요! <b>+${p.pt}점</b>` + (s.tries === 1 ? ' · 한 번에 성공! 👏' : ' · 끝까지 해낸 게 진짜 실력! 🌱')
      : `아깝다! <b>${ok} / ${p.fs.length}</b> 칸 맞았어요. 힌트를 보고 한 단계씩 따라가 볼까요? 💡`;
    if (!all && s.hints === 0) showHint(true);
  }
  $('.act-chk', el).onclick  = grade;
  $('.act-hint', el).onclick = () => showHint(false);
  if (asEx) $('.act-step', el).onclick = e => {
    const box = $('.stepbox', el), next = $('.stp:not(.on)', box);
    box.classList.add('on');
    if (next){ next.classList.add('on'); tex(next); next.scrollIntoView({ behavior:'smooth', block:'nearest' }); if (window.SND) SND.hint(); }
    const left = $$('.stp:not(.on)', box).length;
    e.target.textContent = left ? `👣 다음 단계 (${left}단계 남음)` : '✅ 풀이 끝! 이제 답 칸에 직접 써 보세요';
    if (!left){ e.target.disabled = true; showKey(); }
  };
  if (!asEx) $('.act-sol', el).onclick  = e => {
    sb.classList.toggle('on');
    e.target.textContent = sb.classList.contains('on') ? '풀이 접기' : '📖 풀이 보기';
    if (sb.classList.contains('on')){ showKey(); tex(sb); }
  };
  $('.act-ask', el).onclick = () => {
    const h = $('.askhost', el);
    if (!h.dataset.on){ h.dataset.on = 1; mountComposer(h, { kind:'problem', ref:p.id, refLabel:p.tag, chips:LESSON.concepts,
      ph:'이 문제를 풀다가 생긴 질문을 적어 보세요. (어디서 막혔나요? 왜 그렇게 되나요? 만약 조건이 바뀐다면?)' }); }
    h.scrollIntoView({behavior:'smooth', block:'center'});
  };
  return el;
}

const PRAISE = ['정답이에요! 🎉','완벽해요! 💖','멋지다! ✨','최고예요! 🌟','바로 그거예요! 💫','대단해요! 🍀'];
function celebrate(pt, streak, title){
  launchFW(streak >= 3 ? 5 : 3, streak >= 3);
  SND.correct(streak);
  const t = $('#toast');
  $('.big', t).textContent = title || (streak >= 3 ? `🔥 ${streak}연속 정답!` : PRAISE[Math.floor(Math.random()*PRAISE.length)]);
  $('.sm', t).textContent = pt ? `+${pt}점 · 누적 ${PTS}점` : '질문이 교실을 바꿔요';
  t.classList.add('on');
  clearTimeout(celebrate._h); celebrate._h = setTimeout(() => t.classList.remove('on'), 2100);
}

/* ===================================================================
   🔊 사운드 — Web Audio 로 직접 합성 (외부 음원 파일 없음)
   =================================================================== */
const SND = {
  ctx:null, on:true,
  boot(){
    if (!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  /* 한 음 */
  note(freq, at, dur, {type='triangle', vol=0.22, slide=0, blur=0} = {}){
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(freq + slide, 40), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012 + blur);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  /* 반짝이는 노이즈 (심벌 느낌) */
  shimmer(at, dur = 0.5, vol = 0.1){
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + at;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/n, 2.6);
    const src = c.createBufferSource(); src.buffer = buf;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5200;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(hp); hp.connect(g); g.connect(this.master);
    src.start(t);
  },
  /* 🎉 정답 팡파레 */
  correct(streak = 1){
    if (!this.on || !this.boot()) return;
    const C5=523.25, E5=659.25, G5=783.99, C6=1046.50, E6=1318.51, G6=1567.98;
    // 팡! 하는 도입
    this.note(C5, 0,    0.14, {type:'square',   vol:0.17});
    this.note(E5, 0.085,0.14, {type:'square',   vol:0.17});
    this.note(G5, 0.17, 0.16, {type:'square',   vol:0.18});
    this.note(C6, 0.255,0.42, {type:'triangle', vol:0.26});
    // 아래에 깔리는 화음
    this.note(C5/2, 0.255, 0.55, {type:'sine', vol:0.14});
    this.note(G5/2, 0.255, 0.55, {type:'sine', vol:0.11});
    this.shimmer(0.25, 0.55, 0.085);
    // 연속 정답이면 한 옥타브 더
    if (streak >= 3){
      this.note(E6, 0.46, 0.14, {type:'triangle', vol:0.2});
      this.note(G6, 0.55, 0.30, {type:'triangle', vol:0.22});
      this.shimmer(0.55, 0.45, 0.07);
    }
    // 반짝이 소리
    for (let i = 0; i < 6; i++)
      this.note(1400 + Math.random()*1800, 0.3 + i*0.055, 0.1, {type:'sine', vol:0.055});
  },
  /* 아쉬운 오답 — 기죽지 않게 부드럽게 */
  wrong(){
    if (!this.on || !this.boot()) return;
    this.note(392.00, 0,    0.16, {type:'sine', vol:0.14});
    this.note(329.63, 0.13, 0.26, {type:'sine', vol:0.13});
  },
  /* 힌트 종소리 */
  hint(){
    if (!this.on || !this.boot()) return;
    this.note(1174.66, 0,    0.42, {type:'sine', vol:0.13});
    this.note(1567.98, 0.07, 0.36, {type:'sine', vol:0.09});
  },
  /* 등급 상승 */
  levelUp(){
    if (!this.on || !this.boot()) return;
    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f,i) =>
      this.note(f, i*0.09, 0.5, {type:'triangle', vol:0.2}));
    this.shimmer(0.4, 0.8, 0.1);
  },
  tap(){
    if (!this.on || !this.boot()) return;
    this.note(880, 0, 0.05, {type:'sine', vol:0.06});
  }
};

/* ===================================================================
   🎆 불꽃놀이 — 밝은 배경에서도 잘 보이도록
   =================================================================== */
const fw = $('#fw'), fctx = fw.getContext('2d');
let parts = [], fwRunning = false;
function sizeFW(){ fw.width = innerWidth; fw.height = innerHeight; }
addEventListener('resize', sizeFW); sizeFW();

const PALETTE = ['#ff2d7a','#ff8a3d','#ffc400','#2bd4a0','#2aa7ff','#a855f7','#ff5fa2'];
function burst(x, y, n, power){
  const base = PALETTE[Math.floor(Math.random()*PALETTE.length)];
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = (Math.random()*0.75 + 0.3) * power;
    parts.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 1, decay: 0.008 + Math.random()*0.012,
      col: Math.random() < 0.7 ? base : PALETTE[Math.floor(Math.random()*PALETTE.length)],
      r: Math.random()*2.6 + 1.6,
      star: Math.random() < 0.12
    });
  }
}
/* 종이 꽃가루 */
function confetti(n){
  for (let i = 0; i < n; i++){
    parts.push({
      x: Math.random()*fw.width, y: -20 - Math.random()*120,
      vx: (Math.random()-0.5)*1.6, vy: 1.6 + Math.random()*2.4,
      life: 1, decay: 0.0042 + Math.random()*0.004,
      col: PALETTE[Math.floor(Math.random()*PALETTE.length)],
      r: Math.random()*3 + 2.4, ribbon: true, rot: Math.random()*7, vr: (Math.random()-0.5)*0.3
    });
  }
}
function fwLoop(){
  // 투명 캔버스를 서서히 지워 잔상(트레일)을 만든다
  fctx.globalCompositeOperation = 'destination-out';
  fctx.fillStyle = 'rgba(0,0,0,0.16)';
  fctx.fillRect(0, 0, fw.width, fw.height);
  fctx.globalCompositeOperation = 'source-over';

  parts = parts.filter(p => p.life > 0 && p.y < fw.height + 60);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += p.ribbon ? 0.012 : 0.058;
    if (!p.ribbon){ p.vx *= 0.986; p.vy *= 0.986; }
    p.life -= p.decay;
    if (p.ribbon) p.rot += p.vr;
    fctx.globalAlpha = Math.max(Math.min(p.life, 1), 0);
    fctx.fillStyle = p.col;
    fctx.shadowColor = p.col; fctx.shadowBlur = p.ribbon ? 0 : 9;
    if (p.ribbon){
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      fctx.fillRect(-p.r, -p.r*1.9, p.r*2, p.r*3.8); fctx.restore();
    } else if (p.star){
      fctx.save(); fctx.translate(p.x, p.y);
      fctx.beginPath();
      for (let k = 0; k < 8; k++){
        const rr = k % 2 ? p.r*0.42 : p.r*2.3, an = k * Math.PI/4;
        k ? fctx.lineTo(Math.cos(an)*rr, Math.sin(an)*rr) : fctx.moveTo(Math.cos(an)*rr, Math.sin(an)*rr);
      }
      fctx.closePath(); fctx.fill(); fctx.restore();
    } else {
      fctx.beginPath(); fctx.arc(p.x, p.y, p.r, 0, 7); fctx.fill();
    }
  });
  fctx.shadowBlur = 0; fctx.globalAlpha = 1;
  if (parts.length){ requestAnimationFrame(fwLoop); }
  else { fwRunning = false; fctx.clearRect(0,0,fw.width,fw.height); }
}
function launchFW(rounds, withConfetti){
  for (let k = 0; k < rounds; k++){
    setTimeout(() => {
      const x = fw.width  * (0.16 + Math.random()*0.68);
      const y = fw.height * (0.16 + Math.random()*0.42);
      burst(x, y, 76 + Math.floor(Math.random()*54), 5.6 + Math.random()*2.6);
    }, k * 250);
  }
  if (withConfetti) confetti(70);
  if (!fwRunning){ fwRunning = true; requestAnimationFrame(fwLoop); }
}

      const a = N[i], b = N[j]; let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 0.01, d = Math.sqrt(d2);
      const r = 2600 / d2; a.vx += dx / d * r; a.vy += dy / d * r; b.vx -= dx / d * r; b.vy -= dy / d * r;
    }
    L.forEach(l => { const a = N[l.a], b = N[l.b], dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) + 0.01, s = (d - 90) * 0.02 * (0.6 + l.w / mw);
      a.vx += dx / d * s; a.vy += dy / d * s; b.vx -= dx / d * s; b.vy -= dy / d * s; });
    N.forEach(o => { o.vx += (W / 2 - o.x) * 0.004; o.vy += (H / 2 - o.y) * 0.006; o.x += o.vx * k; o.y += o.vy * k; o.vx *= 0.5; o.vy *= 0.5;
      o.x = Math.max(40, Math.min(W - 40, o.x)); o.y = Math.max(22, Math.min(H - 22, o.y)); });
  }
  const col = n => MATH_SET.has(n) || TM_ONE_KEEP.has(n) || /[⁻∘=]|[xy](축|절편|좌표|값)/.test(n) ? '#7d5fe0' : '#ff6fa3';
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="단어 연결망">
    ${L.map(l => `<line x1="${N[l.a].x.toFixed(1)}" y1="${N[l.a].y.toFixed(1)}" x2="${N[l.b].x.toFixed(1)}" y2="${N[l.b].y.toFixed(1)}" stroke="#b9a8f0" stroke-opacity="${(0.25 + 0.6 * l.w / mw).toFixed(2)}" stroke-width="${(1 + 4 * l.w / mw).toFixed(1)}"><title>${esc(N[l.a].n)} — ${esc(N[l.b].n)} : ${l.w}번 함께</title></line>`).join('')}
    ${N.map(o => { const r = 6 + 14 * Math.sqrt(o.f / mx); return `<g><circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="${r.toFixed(1)}" fill="${col(o.n)}" fill-opacity=".85"><title>${esc(o.n)} · ${o.f}회</title></circle>
      <text x="${o.x.toFixed(1)}" y="${(o.y - r - 3).toFixed(1)}" text-anchor="middle" font-size="${(11 + 5 * o.f / mx).toFixed(1)}" font-weight="900" fill="#3b3363" paint-order="stroke" stroke="#fff" stroke-width="3">${esc(o.n)}</text></g>`; }).join('')}
  </svg>`;
}
/* 한 번에 : 빈도(freq) · 나온 글 수(df) · 동시출현(pairs) */
function tmStats(texts, opt){
  opt = opt || {};
  const f = {}, df = {}, c = {};
  let docs = 0;
  texts.forEach(x => {
    const tk = tokenize(x, opt.math).filter(w => !opt.hide || !opt.hide.has(w));
    if (!tk.length) return;
    docs++;
    tk.forEach(w => { f[w] = (f[w] || 0) + 1; });
    const s = [...new Set(tk)].sort();
    s.forEach(w => { df[w] = (df[w] || 0) + 1; });
    for (let i = 0; i < s.length; i++) for (let j = i + 1; j < s.length; j++){ const k = s[i] + '\u0001' + s[j]; c[k] = (c[k] || 0) + 1; }
  });
  return { docs, freq:Object.entries(f).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])), df,
    pairs:Object.entries(c).map(([k, n]) => [...k.split('\u0001'), n]).sort((a, b) => b[2] - a[2]) };
}

  const btn = $('.save', host), ok = $('.saved', host);
  if (btn) btn.onclick = async () => {
    if (needLogin()) return;
    const body = {};
    $$('[data-k]', host).forEach(el => {
      if (el.dataset.type === 'stars') body[el.dataset.k] = +el.dataset.val || 0;
      else if (el.dataset.type === 'pick') body[el.dataset.k] = el.dataset.val || '';
      else body[el.dataset.k] = el.value.trim();
    });
    if (!Object.values(body).some(v => v)){ snack('한 칸 이상 적어 주세요'); return; }
    try{
      await rpc('qf_respond', { p_lesson:LESSON.code, p_item:item, p_no:ME.no, p_name:ME.name, p_body:body });
      MINE[item] = body;
      if (ok) ok.textContent = '✓ 저장됨 ' + new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
      SND.hint(); snack('저장했어요! 선생님 화면에도 바로 보여요 ✨');
      if (onLoad) onLoad(body, true);
    }catch(e){ snack('저장하지 못했어요: ' + e.message, 3000); }
  };
}
function fillForms(){
  FORMS.forEach(f => {
    const d = MINE[f.item]; if (!d) return;
    $$('[data-k]', f.host).forEach(el => {
      const v = d[el.dataset.k]; if (v == null) return;
      if (el.dataset.type === 'stars' || el.dataset.type === 'pick'){ el.dataset.val = v; if (el._paint) el._paint(); }
      else el.value = v;
    });
    const ok = $('.saved', f.host); if (ok) ok.textContent = '✓ 저장된 답이 있어요';
    if (f.onLoad) f.onLoad(d, false);
  });
}
function clearForms(){
  FORMS.forEach(f => {
    $$('[data-k]', f.host).forEach(el => {
      if (el.dataset.type === 'stars' || el.dataset.type === 'pick'){ el.dataset.val = ''; if (el._paint) el._paint(); }
      else el.value = '';
    });
    const ok = $('.saved', f.host); if (ok) ok.textContent = '';
  });
}

function drawCloud(host, freq, opt){
  opt = opt || {};
  host.innerHTML = '';
  const W = host.clientWidth, H = host.clientHeight;
  if (!W || !H) return;
  if (!freq.length){ host.innerHTML = `<div class="state">${opt.empty || '질문이 모이면 핵심 단어가 여기에 떠올라요 ☁️'}</div>`; return; }
  const mx = freq[0][1], mn = freq[freq.length-1][1];
  const placed = [];
  const meas = document.createElement('span'); meas.style.cssText = 'position:absolute;visibility:hidden;font-weight:900;white-space:nowrap';
  host.appendChild(meas);
  freq.forEach(([w, n], i) => {
    const sc = opt.scale || 1, size = Math.round((15 + (mx === mn ? 14 : (n - mn) / (mx - mn) * 30)) * sc);
    meas.style.fontSize = size + 'px'; meas.textContent = w;
    const bw = meas.offsetWidth + 6, bh = meas.offsetHeight + 2;
    for (let k = 0; k < 900; k++){
      const a = k * 0.32, r = 3.2 * a;
      const x = W/2 + r * Math.cos(a) * 1.35, y = H/2 + r * Math.sin(a) * 0.8;
      const box = [x - bw/2, y - bh/2, x + bw/2, y + bh/2];
      if (box[0] < 4 || box[2] > W - 4 || box[1] < 4 || box[3] > H - 4) continue;
      if (placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
      placed.push(box);
      const s = document.createElement('span');
      s.textContent = w; s.title = `${w} · ${n}회 (클릭하면 숨기기)`;
      s.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;color:${CCOL[i % CCOL.length]};opacity:${0.62 + 0.38*(n-mn+1)/(mx-mn+1)}`;
      if (opt.hideable !== false) s.onclick = () => { HIDE.add(w); if (opt.onHide) opt.onHide(); else if (window.drawClouds) drawClouds(); snack(`「${w}」를 이 화면의 구름에서 숨겼어요`); };
      host.appendChild(s);
      break;
    }
  });
  meas.remove();
}
function drawBars(host, freq){
  const top = freq.slice(0, 8);
  if (!top.length){ host.innerHTML = ''; return; }
  const mx = top[0][1];
  host.innerHTML = `<div class="bars">` + top.map(([w, n]) =>
    `<div class="bar"><div class="bl">${esc(w)}</div><div class="bt"><div style="width:${(n/mx*100).toFixed(1)}%"></div></div><div class="bn">${n}</div></div>`).join('') + `</div>`;
}

  return all.filter(w => flat.includes(w.replace(/\s/g, ''))).sort((a, b) => b.length - a.length);

/* ---------- 🧠 질문 코치 엔진 ---------- */
const ENGINE = {
  analyze(t){
    const terms = termsIn(t), K = kb();
    const mathExpr = /[∘√⁻²³≠≤≥]|[fghFGH]\s*\(|(^|[^a-zA-Z])[fghxyk]([^a-zA-Z]|$)|\d|=/.test(t);
    const lessonWord = K.conds.concat(K.links).some(c => t.includes(c.split(/[ (·,]/)[0]));
    const onTopic = terms.length > 0 || mathExpr || lessonWord;
    const isQ = /\?|까\s*$|까요|나요|가요|니\s*$|는가|인가|일까|을까|ㄹ까|어떻게|왜|무엇|뭐|어디|언제|얼마|몇|누구|어느/.test(t);
    const condWord = /만약|만일|라면|다면|바뀌|바꾸|달라지|없다면|아니라면|대신|늘리|줄이|커지|작아지|0이면|음수|양수/.test(t);

    const compare = /관계|비교|차이|다를|같을|같아|달라|다른\s*점|같은\s*점/.test(t);
    const openW = /왜|어떻게|어떤|무엇이\s*다|차이|관계|언제|어디까지|얼마나|무슨\s*일|어떻게\s*될|설명/.test(t) || compare;
    const open = isQ && (lv !== 'what' || openW);
    const trivial = /(뜻|정의)(이|가|은|는)?\s*(뭐|무엇)/.test(t) && t.length < 22;
    const general = /항상|모든|언제나|반드시|일반|어떤\s*경우|조건/.test(t);

  evaluate(t){
    const A = ENGINE.analyze(t), K = kb(), term = A.terms[0] || (LESSON.concepts || ['함수'])[0];

    const best = AI_CRIT.slice().sort((a, b) => sc[b[0]] - sc[a[0]])[0][0];

    const PR = { open:'답이 하나로 끝나지 않는 열린 질문이라 친구들과 이야기가 이어질 수 있어요.',

      change:'조건을 바꾸어 보는 질문이라 새로운 탐구로 이어질 수 있어요.',
      curious:'친구들도 「어? 정말?」 하고 궁금해할 만한 질문이에요.', inquiry:'직접 계산하거나 그래프로 확인해 볼 수 있는 탐구 질문이에요.' };
    const IM = { open:'「예/아니요」나 한 낱말로 답이 끝나서 대화가 금방 멈출 수 있어요.',
      concept:'오늘 배운 수학 용어가 들어가면 무엇을 묻는지 더 분명해져요.',
      change:'지금은 주어진 상황 그대로를 묻고 있어요. 조건을 하나 바꾸면 질문이 넓어져요.',
      curious:'조금 더 구체적인 예(숫자, 특정 함수, 생활 장면)를 넣으면 친구들도 궁금해해요.',
